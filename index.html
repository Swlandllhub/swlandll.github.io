<title>Swlandll · 生活工作台</title>
<style>
:root{
  --bg:#FDF6F1; --side:#FFF9F5; --card:#FFFFFF;
  --pink:#F5B8C8; --pink-soft:#FBE3EA; --mint:#BFE3D6; --mint-soft:#E7F5EF;
  --lav:#D9CCF2; --lav-soft:#F0EAFB; --butter:#F9E4B5; --butter-soft:#FDF4DE;
  --sky:#C7E3F4; --sky-soft:#E9F4FB; --peach:#F8CFB8; --peach-soft:#FBEAE0;
  --text:#6B5B5E; --sub:#A49196; --line:#F2E4E4;
  --danger:#E89A9A; --shadow:0 6px 18px rgba(200,160,170,.12);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:190px;background:var(--side);border-right:2px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{text-align:center;font-weight:700;font-size:19px;color:#E58BA0;letter-spacing:1px;padding:6px 0 16px}
.logo small{display:block;font-size:10px;color:var(--sub);font-weight:400;letter-spacing:2px;margin-top:2px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:14px;width:100%;transition:.2s;color:var(--sub)}
.nav-item .ic{font-size:21px;filter:grayscale(.45);transition:.2s}
.nav-item span.tx{font-size:12px}
.nav-item:hover{background:var(--pink-soft)}
.nav-item.active{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));color:var(--text)}
.nav-item.active .ic{filter:none;transform:scale(1.12)}
.side-foot{margin-top:auto;text-align:center;font-size:10px;color:#D9C4CB}
/* ---------- main ---------- */
main{flex:1;padding:26px 30px 90px;max-width:1080px}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-sub{color:var(--sub);font-size:12px;margin-bottom:18px}
.mode-toggle{display:inline-flex;background:var(--pink-soft);border-radius:999px;padding:3px;font-size:11px;margin-left:auto}
.mode-toggle button{padding:4px 12px;border-radius:999px;color:var(--sub)}
.mode-toggle button.on{background:#fff;color:#E58BA0;font-weight:600;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{background:linear-gradient(135deg,var(--pink),#F3C4D4);color:#fff;border-radius:999px;padding:8px 20px;font-size:13px;font-weight:600;box-shadow:0 4px 10px rgba(240,170,190,.4);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.mini{padding:4px 12px;font-size:11px;box-shadow:none}
.btn.ghost{background:#fff;color:var(--sub);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost.on{border-color:var(--pink);color:#E58BA0;font-weight:600}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--pink-soft);color:#D97E97}
/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:6px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12px;color:var(--sub)}
.tabs button.on{background:var(--pink-soft);border-color:var(--pink);color:#D97E97;font-weight:600}
/* list items */
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:#FFFDFC;border:1px solid var(--line);margin-bottom:8px}
.item .grow{flex:1;min-width:0}
.item .tt{font-weight:600;font-size:13.5px}
.item .meta{font-size:11px;color:var(--sub);margin-top:2px}
.item.done .tt{text-decoration:line-through;color:#C9B6BC}
.cicon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.op{display:flex;gap:4px}
.op button{font-size:12px;color:#CBB6BE;padding:3px 5px;border-radius:8px}
.op button:hover{background:var(--pink-soft);color:#D97E97}
.chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;cursor:pointer}
.chk.on{background:var(--pink)}
/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl .item{position:relative}
.tl .item::before{content:"";position:absolute;left:-17px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.day-head{font-size:12px;font-weight:700;color:#D97E97;margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.day-head .sum{font-weight:400;color:var(--sub);font-size:11px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:10px;color:var(--sub);padding:4px 0}
.cal .d{padding:6px 0;border-radius:10px;font-size:12px;cursor:pointer}
.cal .d:hover{background:var(--pink-soft)}
.cal .d.sel{background:var(--pink);color:#fff;font-weight:700}
.cal .d.today{border:1.5px dashed var(--pink)}
.cal .d.has{position:relative}
.cal .d.has::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#F2A9BE}
/* category grid */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;cursor:pointer;font-size:10.5px;color:var(--sub)}
.cat:hover{background:var(--pink-soft)}
.cat.on{background:var(--pink-soft);outline:1.5px solid var(--pink);color:#D97E97;font-weight:600}
/* stars */
.stars{cursor:pointer;font-size:18px;letter-spacing:2px;color:#F0C77E}
.stars span{filter:grayscale(1);opacity:.35}
.stars span.on{filter:none;opacity:1}
/* media card —— 收藏卡片样式 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.mcard{background:#FFFDFB;border:1px solid #F3E9E4;border-radius:18px;box-shadow:0 4px 14px rgba(205,175,175,.10);overflow:hidden;display:flex;flex-direction:column;padding:0;transition:.18s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(205,175,175,.18)}
.mcover{height:116px;position:relative;display:flex;align-items:center;justify-content:center}
.mcover .badge{position:absolute;left:9px;top:9px;font-size:10px;background:rgba(255,255,255,.82);color:#A49196;border-radius:8px;padding:2px 7px;line-height:1.5}
.mcover .ic{font-size:34px;opacity:.78}
.mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.mtitle{font-weight:700;font-size:14px;line-height:1.45}
.mstar{font-size:14px;letter-spacing:1.5px;color:#E9BC6A}
.mstar .off{color:#E7DED8}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#A49196}
.mnote{font-size:12px;color:#8E7F84;line-height:1.65}
.mbtns{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.mbtns button{flex:1;border:1.5px solid #F0E2DD;border-radius:12px;padding:7px 0;font-size:12px;color:#8E7F84;background:#fff;transition:.15s}
.mbtns button:hover{background:var(--pink-soft);border-color:var(--pink);color:#D97E97}
.excerpt{background:var(--butter-soft);border-radius:12px;padding:8px 10px;font-size:11.5px;line-height:1.6;margin-top:6px;color:#7C6C6F}
.excerpt .t{font-size:10px;color:#C0A98A;text-align:right;margin-top:4px}
/* diary grid paper */
.paper{width:100%;min-height:180px;resize:vertical;line-height:28px;
 background-image:repeating-linear-gradient(transparent,transparent 27px,#F4E3E8 27px,#F4E3E8 28px);
 background-attachment:local;border-radius:14px;padding:6px 12px}
/* home */
.clock{text-align:center;padding:10px 0 2px}
.clock .t{font-size:44px;font-weight:700;color:#E58BA0;letter-spacing:2px;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--sub);margin-top:2px}
.quote .dtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.5px;background:var(--pink-soft);color:#C77F97;border-radius:999px;padding:3px 14px;margin-bottom:10px}
.quote{text-align:center;padding:6px 20px}
.quote .cn{font-size:15px;font-weight:600;color:#8B7B8F}
.quote .en{font-size:11.5px;color:var(--sub);margin-top:6px;font-style:italic}
.sumcard{border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.sumcard .h{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.sumcard .big{font-size:20px;font-weight:700}
.sumcard .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:4px}
.bar{height:8px;background:#F6E7EA;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),#F3C4D4)}
/* checkin */
.habits{display:flex;flex-wrap:wrap;gap:10px}
.habit{display:flex;align-items:center;gap:8px;background:#FFFDFC;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.habit.on{background:var(--mint-soft);border-color:var(--mint)}
/* 打卡条目：删除按钮 + 长按反馈 */
.habits .habit{padding:6px 7px 6px 13px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
.hb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hb-del{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#D8C3C9;background:#FBF1F3;flex-shrink:0;padding:0 0 1px;opacity:.9;transition:.15s}
.hb-del:hover{background:var(--pink);color:#fff;transform:scale(1.12)}
.habit.longpress{transform:scale(.94);background:var(--lav-soft)}
/* 删除确认弹窗 */
#habitDelMask .modal{max-width:320px;text-align:center}
#habitDelMask .hd-emoji{font-size:30px;line-height:1.3;margin-bottom:4px}
#habitDelMask .hd-name{font-size:12.5px;color:#8E7F84;background:var(--pink-soft);border-radius:12px;padding:7px 12px;margin:2px 0 6px;word-break:break-word}
#habitDelMask .hd-tip{font-size:11px;color:var(--sub);line-height:1.7}
#habitDelMask .mactions{justify-content:center;margin-top:14px}
.btn.warn{background:linear-gradient(135deg,#F0A3A3,#E88C8C);box-shadow:0 4px 10px rgba(230,150,150,.4)}
/* float cmd */
.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-size:22px;box-shadow:0 8px 20px rgba(220,150,180,.45);display:flex;align-items:center;justify-content:center;z-index:50;transition:.2s}
.fab:hover{transform:scale(1.08) rotate(8deg)}
.cmdmenu{position:fixed;right:26px;bottom:90px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(200,150,170,.25);padding:10px;display:none;flex-direction:column;gap:4px;z-index:50;min-width:190px}
.cmdmenu.open{display:flex}
.cmdmenu button{text-align:left;padding:9px 14px;border-radius:12px;font-size:13px}
.cmdmenu button:hover{background:var(--pink-soft)}
/* misc */
.empty{text-align:center;color:#D9C4CB;font-size:12px;padding:24px 0}
.imgprev{max-width:120px;max-height:120px;border-radius:14px;object-fit:cover;margin-top:8px}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.formrow input,.formrow select{font-size:12.5px}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#fff;color:#D97E97;font-weight:600;padding:10px 24px;border-radius:999px;box-shadow:0 8px 24px rgba(220,150,180,.3);z-index:99;display:none}
.week-head{font-size:12px;color:var(--sub);background:var(--lav-soft);border-radius:12px;padding:6px 12px;display:inline-block;margin-bottom:12px}
/* ---------- 书影音 · 二级菜单 ---------- */
.nav-group{display:flex;flex-direction:column}
.nav-parent{position:relative}
.nav-parent .chev{position:absolute;right:9px;top:9px;font-size:9px;color:#D3BBBF;transition:transform .22s}
.nav-parent.open .chev{transform:rotate(180deg)}
.submenu{max-height:0;overflow:hidden;transition:max-height .26s ease;display:flex;flex-direction:column;gap:2px}
.submenu.open{max-height:170px;padding:4px 0 4px 4px}
.sub-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:11px;font-size:12px;color:var(--sub);width:100%;text-align:left;transition:.15s}
.sub-item:hover{background:var(--pink-soft)}
.sub-item.active{background:var(--pink-soft);color:#D97E97;font-weight:600}
/* ---------- 书籍模块 ---------- */
.bk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.bk-tools .btn{padding:5px 11px;font-size:11.5px;box-shadow:none}
.bk-state{font-size:11px;color:var(--sub);margin:8px 0 14px;line-height:1.7}
.wx-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--mint-soft);border:1.5px dashed #BFE3D6;border-radius:16px;padding:11px 14px;font-size:11.5px;color:#6E8F80;line-height:1.75;margin-bottom:18px}
.wx-banner b{color:#4F7A66}
.bk-group{margin-bottom:20px}
.bk-group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bk-group-head h3{font-size:14px}
.bk-count{font-size:10.5px;color:#D97E97;background:var(--pink-soft);border-radius:999px;padding:1px 8px}
.bk-hint{font-size:10.5px;color:#CBB6BE}
.bk-add{margin-left:auto;font-size:11.5px;color:#D97E97;border:1.5px dashed var(--pink);border-radius:999px;padding:4px 12px;background:#fff}
.bk-add:hover{background:var(--pink-soft)}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bk-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.bk-title{font-weight:700;font-size:14px;line-height:1.45;word-break:break-word}
.bk-meta{font-size:11px;color:var(--sub);line-height:1.6;word-break:break-word}
.bk-stars{color:#E9BC6A;font-size:12.5px;letter-spacing:1px}
.bk-note{font-size:12px;color:#8E7F84;line-height:1.65;word-break:break-word}
.bk-tags{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--lav-soft);color:#9A88B8}
.chip.src{background:var(--mint-soft);color:#6FA88C}
.bk-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.bk-acts button{font-size:11.5px;padding:4px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--sub);background:#fff}
.bk-acts button:hover{border-color:var(--pink);color:#D97E97;background:var(--pink-soft)}
.bk-acts button.primary{background:var(--pink-soft);border-color:var(--pink);color:#D97E97;font-weight:600}
.bk-acts button.danger:hover{border-color:var(--danger);color:var(--danger);background:#FDF0F0}
.bk-empty{grid-column:1/-1;text-align:center;font-size:12px;color:#D3BEC4;border:1.5px dashed var(--line);border-radius:16px;padding:22px 10px}
.mv-poster{width:100%;max-height:170px;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--line)}
.mv-quote{background:var(--lav-soft);border-radius:12px;padding:8px 10px;margin-top:2px}
.mv-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#8E7F84;padding:6px 2px;border-bottom:1px dashed var(--line)}
.mv-row:last-child{border-bottom:none}
.bk-progress{display:flex;flex-direction:column;gap:5px}
.bk-progress .bar{height:7px;background:#F8EBEE;border-radius:99px;overflow:hidden}
.bk-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#F7C6D3,#EF9DB4);border-radius:99px;transition:width .3s}
.bk-progress .pr{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub)}
.ex-text{position:relative;font-size:12.5px;color:#6E7B73;line-height:1.85;white-space:pre-wrap;word-break:break-word;max-height:132px;overflow:hidden;cursor:pointer}
.ex-text::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,#fff)}
.ex-text.open{max-height:none}
.ex-text.open::after{display:none}
/* 阅读趋势 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-size:17px;font-weight:700;color:#D97E97}
.stat .k{font-size:10.5px;color:var(--sub);margin-top:2px}
.heat-wrap{overflow-x:auto;padding:4px 0 6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;width:max-content}
.heat i{width:12px;height:12px;border-radius:3.5px;background:#F7EFF1}
.heat i.l1{background:#FBE0E6}.heat i.l2{background:#F7C2CF}.heat i.l3{background:#EF9FB4}.heat i.l4{background:#E27F9C}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub);justify-content:flex-end;margin-top:6px}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:8px;height:152px;padding-top:12px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .b i{width:70%;max-width:38px;background:linear-gradient(180deg,#F9CFD9,#EF9DB4);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .3s}
.bars .b .bv{font-size:9.5px;color:#C9A8B2}
.bars .b .bl{font-size:9.5px;color:var(--sub)}
/* 年度书单 */
.yr-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.yr-head b{font-size:16px;color:#D97E97}
.yr-month{margin-bottom:13px}
.yr-month .ym{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#B08A98;margin-bottom:6px}
.yr-month .ym::after{content:"";flex:1;height:1px;background:var(--line)}
.yr-books{display:flex;flex-wrap:wrap;gap:8px}
.yr-book{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(200,160,170,.06)}
.yr-book .yrs{color:#E9BC6A;font-size:11px}

<script>
/* ================= 数据层（全部 localStorage 本地留存） ================= */
const KEY='swlandll_data_v1';
const DEFAULT={
  modes:{todo:'accumulate',finance:'accumulate',diet:'accumulate',outfit:'accumulate',media:'accumulate',diary:'accumulate',thoughts:'accumulate',review:'accumulate'},
  todo:{todo:[],monthly:[],plan:[]},
  finance:{records:[],cats:[],budget:0},
  diet:{records:[],summaries:[]},
  outfit:{daily:[],wardrobe:[]},
  media:{book:[],movie:[],music:[]},
  diary:[], thoughts:[], review:[],
  checkin:{habits:[],logs:{}},
  quotes:{custom:[],daily:{}},
  ai:{base:'',model:'',key:'',preset:'openai',cutout:true},
  sync:{provider:'builtin',code:'',endpoint:'',auto:false,lastAt:0,withImages:true},
  deviceId:'', updatedAt:0,
  imgMigrated:false,
  diaryReminder:'', exported:0
};
let D=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));const merged=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d||{});
// 旧数据迁移：日计划并入日待办
if(merged.todo&&merged.todo.daily){merged.todo.todo=[...(merged.todo.todo||[]),...merged.todo.daily];delete merged.todo.daily;}
merged.ai=Object.assign(JSON.parse(JSON.stringify(DEFAULT.ai)),merged.ai||{});
merged.sync=Object.assign(JSON.parse(JSON.stringify(DEFAULT.sync)),merged.sync||{});
if(!merged.outfit)merged.outfit={daily:[],wardrobe:[]};
if(!Array.isArray(merged.outfit.wardrobe))merged.outfit.wardrobe=[];
return merged;}catch(e){return JSON.parse(JSON.stringify(DEFAULT));}}
/* 每次写入都落 localStorage，并打上时间戳；有云端同步时再触发一次静默上传 */
function persist(){
  D.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(D));
    const el=document.getElementById('saveHint');
    if(el)el.textContent='已保存 '+nowTime();
  }catch(e){toast('本地空间不足，请先导出备份或清理旧图片 ⚠️');}
}
function save(){persist();if(typeof scheduleSync==='function')scheduleSync();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function weekKey(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return t.getFullYear()+'-W'+String(1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7)).padStart(2,'0');}
function fmtCN(s){if(!s)return'';const [y,m,d]=s.split('-');return `${m}月${d}日`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1800);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* 选图后先压缩再进本地库：长边 1400、JPEG 0.82，体积通常降到原来的 1/8 */
function readImg(input,cb){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async e=>{
    const raw=e.target.result;
    try{cb(await shrinkImg(raw,1400,0.82));}
    catch(_){cb(raw);}
  };
  r.readAsDataURL(f);
}
// 每日重置模式下：只看今天的记录
function byMode(list,mod){return D.modes[mod]==='daily'?list.filter(x=>x.date===today()):list;}

/* ================= 首页 · 每日内容卡片（5 类轮换，每天一类，全本地） =================

   防重复：记录最近 3 条已展示过的内容，刷新时优先避开。 */

 ['A','📖 今日书摘'],['B','💡 今日冷知识'],['C','🎬 今日影片推荐'],['D','🎵 今日音乐推荐'],['E','🏮 今日小众诗词']
];
const DAILY_POOL={
A:[
 ['梨花的瓣子是月亮做的。','The petals of a pear blossom are cut from the moon.','汪曾祺《人间草木》'],
 ['世界就在手边，躺倒就是睡眠。','The world sits within arm\'s reach; to lie down is to sleep.','李娟《我的阿勒泰》'],
 ['岁月不饶人，我亦未曾饶过岁月。','The years spare no one — and I have never spared them either.','木心《素履之往》'],
 ['人是为了活着本身而活着，而不是为了活着之外的任何事物而活着。','A person lives for living itself, not for anything that lies beyond living.','余华《活着》'],
 ['我不再装模作样地拥有很多朋友，而是回到了孤单之中，以真正的我开始了独自的生活。','I stopped pretending to have many friends and went back to being alone, starting a solitary life as my real self.','余华《在细雨中呼喊》'],
 ['事情都是被逼出来的，人只有被逼上绝路了，才会有办法。','Things are forced into being; only when a person is backed into a corner does he find a way.','余华《许三观卖血记》'],
 ['世界上的事情，最忌讳的就是个十全十美。','In this world, the one thing to be avoided above all is perfection.','莫言《檀香刑》'],
 ['八月深秋，无边无际的高粱红成汪洋的血海。','In deep August the endless sorghum turned red, a vast ocean of blood.','莫言《红高粱家族》'],
 ['暴风雨结束后，你不会记得自己是怎样活下来的，但有一件事是确定的：当你穿过了暴风雨，你就不再是原来那个人。','When the storm is over you will not remember how you survived — but one thing is certain: you are no longer the person who walked into it.','村上春树《海边的卡夫卡》'],
 ['死并非生的对立面，而作为生的一部分永存。','Death is not the opposite of life, but a part of it that goes on living.','村上春树《挪威的森林》'],
 ['你要做一个不动声色的大人了。不许情绪化，不许偷偷想念，不许回头看。','It is time to be a grown-up who keeps a still face: no tantrums, no secret missing, no looking back.','村上春树《舞！舞！舞！》'],
 ['穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。','Through the long tunnel at the border lies the snow country; beneath the night sky all is a pale white.','川端康成《雪国》'],
 ['山路变得弯弯曲曲，快到天城岭了。这时，骤雨白亮亮地笼罩着茂密的杉林。','The road grew winding as I neared Amagi Pass; a sudden rain came down bright and white over the dense cedar woods.','川端康成《伊豆的舞女》'],
 ['美的东西，对我来说，是怨敌。','For me, anything beautiful is an enemy.','三岛由纪夫《金阁寺》'],
 ['一天早晨，格里高尔·萨姆沙从不安的睡梦中醒来，发现自己躺在床上变成了一只巨大的甲虫。','One morning Gregor Samsa woke from uneasy dreams to find himself transformed in his bed into a monstrous insect.','卡夫卡《变形记》'],
 ['巴尔扎克的手杖上刻着：我在粉碎一切障碍；我的手杖上刻着：一切障碍都在粉碎我。','On Balzac\'s walking stick: I crush every obstacle. On mine: every obstacle crushes me.','卡夫卡《谈话录》'],
 ['真正的发现之旅不在于寻找新的风景，而在于拥有新的眼光。','The real voyage of discovery consists not in seeking new landscapes but in having new eyes.','普鲁斯特《追忆似水年华》'],
 ['当一个人不能拥有的时候，他唯一能做的便是不要忘记。','When one cannot have something, the only thing left is not to forget it.','普鲁斯特《追忆似水年华》'],
 ['唯一真实的乐园是人们失去的乐园。','The only true paradise is the one we have lost.','普鲁斯特《追忆似水年华》'],
 ['今天，妈妈死了。也许是昨天，我不知道。','Today Mother died. Or maybe yesterday; I don\'t know.','加缪《局外人》'],
 ['必须想象西西弗是幸福的。','One must imagine Sisyphus happy.','加缪《西西弗神话》'],
 ['在人的身上，值得赞赏的东西总多于值得蔑视的东西。','There is more in people to admire than to despise.','加缪《鼠疫》'],
 ['知识可以传授，智慧却不能。','Knowledge can be communicated, but not wisdom.','黑塞《悉达多》'],
 ['鸟从蛋里挣脱出来。蛋是世界。谁要想诞生，就必须先摧毁一个世界。','The bird fights its way out of the egg. The egg is the world. Whoever would be born must first destroy a world.','黑塞《德米安》'],
 ['人可以被毁灭，但不能被打败。','A man can be destroyed but not defeated.','海明威《老人与海》'],
 ['假如你年轻时在巴黎生活过，那么此后无论你到哪里，巴黎都将与你同在，因为它是一席流动的盛宴。','If you were lucky enough to live in Paris as a young man, then wherever you go afterwards it stays with you, for Paris is a moveable feast.','海明威《流动的盛宴》'],
 ['你们都是迷惘的一代。','You are all a lost generation.','海明威《太阳照常升起》'],
 ['死是一件不必急于求成的事，死是一个必然会降临的节日。','Death is not something to be hurried; it is a festival that will surely come.','史铁生《我与地坛》'],
 ['一个人，出生了，这就不再是一个可以辩论的问题，而只是上帝交给他的一个事实。','Once a person is born, it is no longer a question for argument but simply a fact handed to him.','史铁生《我与地坛》'],
 ['上天叫我看见，叫我听见，叫我置身其中，又叫我超然物外。','Heaven lets me see, lets me hear, sets me inside it all, and keeps me outside it too.','阿来《尘埃落定》'],
 ['多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。','Many years later, as he faced the firing squad, Colonel Aureliano Buendía was to remember that distant afternoon when his father took him to discover ice.','马尔克斯《百年孤独》'],
 ['我偏爱写诗的荒谬，胜过不写诗的荒谬。','I prefer the absurdity of writing poems to the absurdity of not writing poems.','辛波斯卡《种种可能》'],
 ['傍晚是一天中最好的时候。','The evening is the best part of the day.','石黑一雄《长日将尽》'],
 ['有些事我们说无法原谅，或者说永远不原谅自己。可我们还是会原谅——一次又一次。','We say of some things that they can\'t be forgiven, or that we will never forgive ourselves. But we do — we do it all the time.','爱丽丝·门罗《亲爱的生活》'],
 ['我什么也不是。这天晚上，我只是咖啡店灯光下的一个影子。','I am nothing. This evening I am only a shadow under the cafe lights.','莫迪亚诺《暗店街》'],
 ['地狱并不是将来才有的；它已经存在了，就在此地，就在我们每天生活的地方。','Hell is not something that comes later; it is already here, in this very place where we live each day.','卡尔维诺《看不见的城市》'],
 ['我要让你知道我的整个一生，我的一生一直是属于你的，而你却对我一无所知。','I want you to know my whole life; it has always belonged to you, and you know nothing of me.','茨威格《一个陌生女人的来信》'],
 ['请爱你的问题本身，像爱一间上了锁的房间。','Love your questions themselves, as you would love a locked room.','里尔克《给青年诗人的信》'],
 ['一个女人如果要写小说，她必须有钱，还有一间自己的房间。','A woman must have money and a room of her own if she is to write fiction.','伍尔夫《一间自己的房间》'],
 ['最沉重的负担同时也是最强盛的生命力的影像。','The heaviest burden is at the same time the image of the fullest vitality.','昆德拉《不能承受的生命之轻》'],
 ['从话语中，你很少能学到人性，从沉默中却能。','You rarely learn human nature from speech; from silence you can.','王小波《沉默的大多数》'],
 ['我是雨和雪的老熟人了，我有九十岁了。','Rain and snow and I are old acquaintances; I am ninety years old now.','迟子建《额尔古纳河右岸》'],
 ['生如夏花之绚烂，死如秋叶之静美。','Let life be beautiful like summer flowers and death like autumn leaves.','泰戈尔《飞鸟集》'],
 ['人生如痴人说梦，充满着喧哗与骚动，却没有任何意义。','Life is a tale told by an idiot, full of sound and fury, signifying nothing.','福克纳《喧哗与骚动》'],
 ['时间永远分岔，通向无数的将来。','Time forks forever into an infinite number of futures.','博尔赫斯《小径分岔的花园》'],
],
B:[
 ['企鹅求婚时，会把一颗捡来的小石头送给心仪的对象；如果对方也叼来一颗，就算定情啦。','When penguins propose, they offer a pebble they picked out themselves. If the other penguin brings one back, they are officially a pair.','动物行为学'],
 ['海獭睡觉时会手牵着手，免得睡着睡着被海流冲散。','Sea otters hold hands while they nap, so the current will not drift them apart.','海洋生物学'],
 ['树木会通过地下的真菌网络互通消息，哪棵树缺水缺糖，邻居们会悄悄递过去。','Trees message each other through underground fungal networks, quietly passing water and sugar to whichever neighbour is running low.','菌根研究'],
 ['月亮正以每年约 3.8 厘米的速度悄悄离开地球，大概是手指甲生长的速度。','The Moon is quietly drifting away from Earth at about 3.8 cm a year — roughly the speed your fingernails grow.','天文学'],
 ['猫的鼻子纹路和人的指纹一样，每一只都是独一无二的。','A cat\'s nose print is as unique as a human fingerprint — no two cats are alike.','兽医解剖学'],
 ['一朵雪花从云底飘到地面，大约要花一个小时，路上还会慢悠悠地转很多圈。','A snowflake can take about an hour to drift from the cloud to the ground, spinning leisurely the whole way down.','气象学'],
 ['考古学家在古埃及墓穴里发现过三千多年前的蜂蜜，居然还没有变质。','Archaeologists have found honey in ancient Egyptian tombs over three thousand years old — still perfectly good.','考古学'],
 ['香蕉在植物学上其实是一种浆果，而草莓不是。','Botanically speaking, a banana is a berry — and a strawberry is not.','植物学'],
 ['章鱼有三颗心脏，血液是蓝色的。','An octopus has three hearts and blue blood.','海洋生物学'],
 ['长颈鹿的颈椎骨和人一样，只有七块。','A giraffe has exactly seven neck bones — the same number as you.','比较解剖学'],
 ['一朵普通的积云，重量大约有五百吨，相当于一百头大象浮在天上。','An ordinary cumulus cloud weighs about five hundred tonnes — roughly a hundred elephants floating overhead.','大气物理'],
 ['金星自转一圈要二百四十多天，比它绕太阳一圈还慢，所以在金星上，一天比一年长。','Venus turns once on its axis in about 243 days — slower than its year, so a day there lasts longer than a year.','行星科学'],
 ['水熊虫能在真空、强辐射和零下一百多度的环境里活下来，干燥十年泡点水还能醒。','Tardigrades survive vacuum, hard radiation and extreme cold, and can revive after a decade of dryness with a drop of water.','极端微生物学'],
 ['全球平均每秒发生约四十五次闪电，一天差不多四百万次。','Lightning strikes the Earth about forty-five times a second — some four million times a day.','大气电学'],
 ['闪电通道的温度可达三万摄氏度，是太阳表面温度的五倍左右。','A lightning channel can reach 30,000 °C — about five times the surface of the Sun.','大气电学'],
 ['海豚有自己的“名字”：每只海豚都有一套独特的签名口哨，同伴会用它来叫它。','Dolphins have names: each one develops a signature whistle, and pod-mates use it to call them.','海洋声学'],
 ['出生时人的骨骼大约有三百块，成年后只剩二百零六块，因为有些骨头长在一起了。','A baby is born with about 300 bones; an adult has 206, because some of them fuse together.','人体解剖学'],
 ['舌头的味觉地图是错的：酸甜苦咸鲜的受体分布在整条舌头上，并没有分区。','The tongue map is a myth: receptors for sweet, sour, bitter, salty and umami are spread across the whole tongue.','感官科学'],
 ['每个人每天大约分泌一到一点五升唾液，一辈子能装满两个浴缸。','You produce one to one and a half litres of saliva a day — two bathtubs over a lifetime.','生理学'],
 ['记忆每被回忆一次，就会被重新写一遍，所以同一件事讲得越多，版本越不一样。','Every time a memory is recalled it gets rewritten, so the more often you tell a story, the more it changes.','认知神经科学'],
 ['咖啡因在体内的半衰期约五小时，下午三点的那杯咖啡，到晚上八点还剩一半。','Caffeine has a half-life of about five hours: half of that 3 p.m. coffee is still with you at 8 p.m.','药理学'],
 ['一茶匙健康的土壤里，细菌的数量比地球上的人口还多。','A single teaspoon of healthy soil holds more bacteria than there are people on Earth.','土壤微生物学'],
 ['草莓的“籽”其实长在表面，每一颗都是一枚果实，一颗草莓上能有二百粒。','A strawberry wears its seeds on the outside — each one is a separate fruit, up to two hundred per berry.','植物学'],
 ['蜂蜜几乎不会变质，因为它的水分太少、酸度太高，细菌根本活不下去。','Honey practically never spoils: too little water, too much acid — bacteria simply cannot survive in it.','食品科学'],
 ['珠穆朗玛峰每年还在长高约四毫米，印度板块仍在向北挤。','Everest is still rising about four millimetres a year as the Indian plate keeps pushing north.','地质学'],
 ['大象是少数能通过镜子认出自己的动物之一，和人类、黑猩猩、海豚同列。','Elephants are among the few animals that recognise themselves in a mirror, along with humans, chimps and dolphins.','比较心理学'],
 ['蝴蝶用脚尝味道，落在叶子上先“踩一踩”，才知道能不能吃。','Butterflies taste with their feet — they land and step on a leaf before deciding it is edible.','昆虫学'],
 ['雨的气味来自土壤里的放线菌，干旱越久，第一场雨越香。','The smell of rain comes from soil bacteria called actinomycetes — the longer the dry spell, the sweeter the first rain.','微生物学'],
 ['人类和香蕉共享大约百分之五十的基因，和黑猩猩共享约百分之九十八点八。','Humans share roughly 50% of their genes with a banana, and about 98.8% with a chimpanzee.','基因组学'],
 ['太阳光从太阳跑到地球，需要八分二十秒，你看到的太阳永远是八分钟前的。','Sunlight takes eight minutes and twenty seconds to reach us, so you only ever see the Sun as it was eight minutes ago.','天文学'],
],
C:[
 ['《海鸥食堂》：赫尔辛基开了一家只做饭团的小食堂，客人们慢悠悠地来，把各自的心事就着饭团咽下去。','In "Kamome Diner," a tiny Helsinki cafe serves nothing but rice balls, and its unhurried customers swallow their little worries along with them.','荻上直子 · 2006'],
 ['《眼镜》：大家都到南方小岛度假了，却发现那里最正经的事，是每天喝冰沙、发呆和午睡。','In "Megane," everyone holidays on a tiny southern island, where the most serious business is shaved ice, daydreaming and afternoon naps.','荻上直子 · 2008'],
 ['《莫娣》：一位患关节炎的乡村女性用画笔把小木屋画满花，爱情也跟着开了进来。','In "Maudie," a folk artist with arthritis paints flowers over every wall of her little house, and love moves in with them.','艾斯林·沃什 · 2016'],
 ['《寂静人生》：一位为逝者办后事的先生，一生认真对待每个不被记得的人，看完想立刻给老朋友打个电话。','In "Still Life," a gentle man arranges funerals for the forgotten. Watching it makes you want to call an old friend right away.','乌贝托·帕索里尼 · 2013'],
 ['《米花之味》：在城市打工的妈妈回到云南山寨，和女儿重新认识彼此，结尾石洞里那段舞轻盈得像羽毛。','In "The Taste of Rice Flower," a mother returns from the city to a Yunnan village to re-meet her daughter; the cave dance at the end is light as a feather.','鹏飞 · 2017'],
 ['《四个春天》：镜头里只是导演自己的爸妈——熏腊肠、修屋顶、等燕子回来，却把日子过成了诗。','"Four Springs" simply films the director\'s own parents — curing sausages, fixing the roof, waiting for swallows — and turns everyday life into poetry.','陆庆屹 · 2018'],
 ['《蜂蜜之地》：北马其顿山野里最后一位女养蜂人，她和蜂群、大地的相处安静得能听见风。','"Honeyland" follows the last wild beekeeper in North Macedonia; her quiet life with the bees lets you almost hear the wind.','塔玛拉·科特夫斯卡 · 2019'],
 ['《哪啊哪啊神去村》：都市青年误入深山当伐木工，一百年的树和几百年的村规，慢慢把他变得柔软。','In "Wood Job!," a city kid stumbles into mountain forestry work; century-old trees and village customs slowly soften him up.','矢口史靖 · 2014'],
 ['《小森林》：从城市逃回东北山村，种田、做饭、听雨，四季一餐一餐地过，安静得能闻见米香。','"Little Forest" returns a city girl to a mountain village: farming, cooking, listening to rain, and letting the seasons pass one meal at a time.','森淳一 · 2014'],
 ['《比海更深》：一个失败的中年男人，为了看儿子在母亲家里多待了一夜，就着一碗面把一生都翻了出来。','In "After the Storm," a washed-up novelist spends one long night at his mother\'s flat, and over a bowl of noodles his whole life spills out.','是枝裕和 · 2016'],
 ['《步履不停》：一家人团聚一天，煮玉米、剥毛豆、说起死去的大哥，什么都没发生，什么也都发生了。','"Still Walking" gathers a family for a single day of corn and edamame and talk of the brother who died; nothing happens, and everything does.','是枝裕和 · 2008'],
 ['《澄沙之味》：一家铜锣烧小店的老板，跟着一位老人学着怎样等一锅豆沙慢慢熬出春天。','In "An," a waffle-shop owner learns from an old woman how to wait for a pot of bean paste to slowly turn into spring.','河濑直美 · 2015'],
 ['《横道世之介》：一个有点笨拙的男孩，什么都没做成，却成了很多人一生里最好的那一段回忆。','"A Story of Yonosuke" follows a clumsy, unremarkable boy who achieves nothing and becomes the best memory of many people\'s lives.','冲田修一 · 2013'],
 ['《编舟记》：一群人花十五年编一本国语辞典，为了给一个词写下最准确的定义，吵得很幸福。','"The Great Passage" spends fifteen years making a dictionary; arguing over the most exact definition of a single word turns out to be a happy way to live.','石井裕也 · 2013'],
 ['《啄木鸟和雨》：一个拍僵尸片的剧组住进山里的小镇，怯生生的年轻人慢慢学会了喊“开机”。','"The Woodsman and the Rain" drops a zombie-movie crew into a mountain town, and a shy young man slowly learns how to shout "action."','冲田修一 · 2011'],
 ['《南极料理人》：在南极的基地里，八个男人最大的事就是等一顿饭，烤一块面包能开心一整天。','In "The Chef of South Polar," eight men at an Antarctic base live for the next meal; a loaf of fresh bread makes an entire day.','冲田修一 · 2009'],
 ['《百元之恋》：三十二岁的女人在便利店打工，后来去打拳击，输得很惨，可她终于自己站起来了一次。','In "100 Yen Love," a thirty-two-year-old shop worker takes up boxing, loses badly, and stands up for herself for the first time.','武正晴 · 2014'],
 ['《夜空总有最大密度的蓝色》：两个在东京打零工的人，在便利店的灯和救护车声里，笨拙地靠近彼此。','"The Tokyo Night Sky Is Always the Densest Shade of Blue" brings two part-timers together, awkwardly, among convenience-store lights and ambulance sirens.','石井裕也 · 2017'],
 ['《帕特森》：一个巴士司机每天写诗，写关于火柴、关于妻子做的杯子，日子重复却从不空洞。','"Paterson" drives a bus, writes poems about matches and the cups his wife makes, and a repeating life turns out never to be empty.','吉姆·贾木许 · 2016'],
 ['《咖啡与香烟》：十一段黑白短片，全是两个人坐着抽烟、喝咖啡、说些没头没尾的话。','"Coffee and Cigarettes" is eleven black-and-white vignettes of people sitting, smoking, drinking coffee, and talking about nothing in particular.','吉姆·贾木许 · 2003'],
 ['《弗兰西丝·哈》：一个总在摔跤的舞者，穷、笨、迟到，却把友谊过得比谁都认真。','"Frances Ha" stumbles through New York — broke, clumsy, always late — and takes friendship more seriously than anyone around her.','诺亚·鲍姆巴赫 · 2012'],
 ['《初恋这首情歌》：1980 年代的都柏林，男孩为了追女孩组了支乐队，歌写得比人生顺。','"Sing Street" sends a Dublin boy into 1980s bands to impress a girl; the songs come out far smoother than his life.','约翰·卡尼 · 2016'],
 ['《布鲁克林》：爱尔兰姑娘去了纽约，在异乡的冬天里慢慢长出另一个自己，然后再回家看一眼。','In "Brooklyn," an Irish girl builds another self through a New York winter, then goes home once more to see what she left.','约翰·克劳利 · 2015'],
 ['《燃烧女子的肖像》：十八世纪的海岛上，一位女画家为不肯配合的小姐画像，两人在琴声里互相看见。','"Portrait of a Lady on Fire" sets a painter before a reluctant sitter on an eighteenth-century island, and they see each other through the sound of a harpsichord.','瑟琳·席安玛 · 2019'],
 ['《罗马》：一个女佣在 1970 年代的墨西哥城，收拾别人家的地板，也收拾自己塌下来的生活。','"Roma" follows a housekeeper in 1970s Mexico City, cleaning other people\'s floors while her own life collapses around her.','阿方索·卡隆 · 2018'],
 ['《完美的日子》：一个公厕清洁工，听磁带、拍树影、看天空，把重复的日子过成了一套仪式。','"Perfect Days" follows a public-toilet cleaner who plays cassettes, photographs leaves, looks at the sky, and turns repetition into ritual.','维姆·文德斯 · 2023'],

function dayOfYearNum(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);}
function dailyState(){
  D.quotes=D.quotes||{};D.quotes.daily=D.quotes.daily||{};return D.quotes.daily;
}
/* ---- 防重复：记住最近 3 条展示过的内容 ---- */
function recentList(){D.quotes=D.quotes||{};D.quotes.recent=D.quotes.recent||[];return D.quotes.recent;}
function dailyKey(t,item){return t+'|'+String(item&&item[0]||'').slice(0,20);}
function noteShown(t,item){
  const key=dailyKey(t,item),r=recentList();
  if(r[0]===key)return;
  r.unshift(key);if(r.length>3)r.length=3;
  save();
}
// 当天确定性挑选：日期 → 一类 + 一条（同一天固定），并避开最近 3 条
function dailyPick(){
  const doy=dayOfYearNum();
  const t=DAILY_TYPES[doy%DAILY_TYPES.length][0];
  const pool=DAILY_POOL[t];
  const r=recentList();
  let i=doy%pool.length,tries=0;
  while(tries<pool.length&&r.indexOf(dailyKey(t,pool[i]))>-1){i=(i+1)%pool.length;tries++;}
  return {t:t,i:i};
}
function currentDaily(){
  const st=dailyState();
  if(st.date!==today()||!st.t||!DAILY_POOL[st.t]||!Number.isInteger(+st.i)){const p=dailyPick();st.date=today();st.t=p.t;st.i=p.i;st.ai=null;save();}
  const pool=DAILY_POOL[st.t];return pool[(+st.i||0)%pool.length];
}
function dailyLabel(t){const x=DAILY_TYPES.find(x=>x[0]===t);return x?x[1]:'今日推荐';}
function dailyCardHTML(){
  const st=dailyState(),d=currentDaily();
  noteShown(st.t,d);
  return `<div class="dtag">${dailyLabel(st.t)}</div>
  <div class="cn">🌷 ${esc(d[0])}</div>
  ${d[1]?`<div class="en">${esc(d[1])}</div>`:''}
  ${d[2]?`<div style="margin-top:6px;font-style:normal;color:#D9A9BC;font-size:11.5px">—— ${esc(d[2])}</div>`:''}
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="btn ghost mini" onclick="changeDaily()">换一条 ✨</button>
    <button class="btn ghost mini" onclick="favDaily()">📌 收藏到随想</button>
  </div>
  <div style="font-size:10.5px;color:#CDB7BF;margin-top:8px">🌿 每日灵感 · 每天自动轮换一类 · 内容持续更新</div>`;
}
function renderDailyCard(){const c=document.querySelector('.quote');if(c)c.innerHTML=dailyCardHTML();}
// 手动刷新：纯本地随机换一条，避开最近 3 条
function changeDaily(){
  const st=dailyState();
  let t=(Math.random()<0.5)?DAILY_TYPES[Math.floor(Math.random()*DAILY_TYPES.length)][0]:st.t;
  const pool=DAILY_POOL[t],r=recentList();
  let i=Math.floor(Math.random()*pool.length),tries=0;
  while(tries<pool.length&&(r.indexOf(dailyKey(t,pool[i]))>-1||(t===st.t&&i===(+st.i||0)))){i=(i+1)%pool.length;tries++;}
  st.t=t;st.i=i;st.ai=null;save();renderDailyCard();toast('换好啦 ✨');
}

function parseDailyJSON(txt){
  const s=String(txt||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const m=s.match(/\{[\s\S]*\}/);
  if(!m)return null;
  try{
    const o=JSON.parse(m[0]);
    const cn=String(o.cn||o.zh||o.text||'').trim();
    const en=String(o.en||o.english||'').trim();
    const by=String(o.by||o.author||o.source||'').trim();
    if(!cn||!by)return null;
    if(/佚名|匿名|网络|网友|未知|unknown|anonymous/i.test(by))return null;  // 红线：不接受无出处
    return [cn,en,by];
  }catch(e){return null;}
}
async function askDailyAI(t){
  const spec=DAILY_AI_SPEC[t];if(!spec)return null;
  const sys='你是一位中文内容编辑，为个人生活手账挑选每日一句，品味安静、具体、不煽情。只输出一个 JSON 对象，不要解释，不要 Markdown 代码块。';
  const user='请生成一条「'+spec.name+'」。\n要求：'+spec.rule+'\n另外给出一句自然、地道的英文翻译（不是直译腔）。\n不要与常见名句重复，也不要推荐已经烂大街的句子。\n输出格式严格为：{"cn":"中文内容","en":"English translation","by":"署名"}';
  const r=await aiChat([{role:'system',content:sys},{role:'user',content:user}],{max:500});
  const item=parseDailyJSON(r);
  if(!item)return null;
  const pool=DAILY_POOL[t]||[];
  const lib=(D.quotes&&D.quotes.lib&&D.quotes.lib[t])||[];
  if(pool.some(x=>x[0]===item[0])||lib.some(x=>x[0]===item[0]))return null;   // 撞了已有的就别换
  return item;
}
/* 生成过的内容进个人内容库：越用越大，理论上没有上限 */
function addToLib(t,item){
  D.quotes=D.quotes||{};D.quotes.lib=D.quotes.lib||{};

/* ---- 打卡：点按切换（长按后不触发）+ 长按唤起删除 ---- */
function habitTap(e,id){
  const el=e.currentTarget;
  if(el&&el._lp){el._lp=false;return;}
  if(e.target.closest('.hb-del'))return;
  toggleHabit(id);
}
function bindHabitLongPress(){
  document.querySelectorAll('.habit[data-hid]').forEach(el=>{
    let timer=null,sx=0,sy=0;
    const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}el.classList.remove('longpress');};
    const start=(x,y)=>{
      cancel();sx=x;sy=y;el.classList.add('longpress');
      timer=setTimeout(()=>{
        timer=null;el.classList.remove('longpress');el._lp=true;
        if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}
        askDelHabit(el.dataset.hid);
        setTimeout(()=>{el._lp=false;},900);
      },550);
    };
    if(window.PointerEvent){
      el.addEventListener('pointerdown',ev=>{
        if(ev.target.closest('.hb-del'))return;
        if(ev.pointerType==='mouse'&&ev.button!==0)return;
        start(ev.clientX,ev.clientY);
      });
      el.addEventListener('pointermove',ev=>{if(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)cancel();});
      el.addEventListener('pointerup',cancel);
      el.addEventListener('pointercancel',cancel);
      el.addEventListener('pointerleave',cancel);
    }else{
      el.addEventListener('touchstart',ev=>{if(ev.target.closest('.hb-del'))return;const t=ev.touches[0];start(t.clientX,t.clientY);},{passive:true});
      el.addEventListener('touchmove',ev=>{const t=ev.touches[0];if(!timer||Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10)cancel();},{passive:true});
      el.addEventListener('touchend',cancel);
      el.addEventListener('touchcancel',cancel);
    }
    /* 长按不弹出系统菜单 / 不选中文字 */
    el.addEventListener('contextmenu',ev=>ev.preventDefault());
  });
}

function renderFinReport(){
  const mrecs=D.finance.records.filter(r=>r.date.startsWith(finMonth));
  const expBy={};mrecs.filter(r=>r.type==='expense').forEach(r=>expBy[r.category]=(expBy[r.category]||0)+r.amount);
  document.getElementById('finBody').innerHTML=`<div class="card">
    <div class="tabs">${[['pie','🥧 分类占比'],['trend','📈 每日趋势'],['cmp','⚖️ 收支对比']].map(([k,n])=>`<button data-rt="${k}" onclick="window._rt='${k}';renderFinReport()">${n}</button>`).join('')}</div>
    <div id="chartBox" style="text-align:center"></div>
    <div id="chartLegend" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;font-size:11px;color:var(--sub)"></div></div>`;
  document.querySelectorAll('[data-rt]').forEach(b=>b.classList.toggle('on',b.dataset.rt===(window._rt||'pie')));
  const rt=window._rt||'pie', box=document.getElementById('chartBox'), lg=document.getElementById('chartLegend');
  if(rt==='pie'){
    const data=Object.entries(expBy).sort((a,b)=>b[1]-a[1]);const total=data.reduce((s,d)=>s+d[1],0);
    if(!total){box.innerHTML='<div class="empty">本月暂无支出数据</div>';return;}
    box.innerHTML='<canvas id="pie" width="300" height="300"></canvas>';
    const ctx=document.getElementById('pie').getContext('2d');let ang=-Math.PI/2;const cx=150,cy=150,R=120;
    const P=['#F5B8C8','#BFE3D6','#D9CCF2','#F9E4B5','#C7E3F4','#F8CFB8','#E8A8C0','#9ED0BC','#BCA8E8','#F0CE8F','#A8CFE8','#F0B8A8'];
    data.forEach((d,i)=>{const a2=ang+d[1]/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang,a2);ctx.fillStyle=P[i%P.length];ctx.fill();ang=a2;});
    ctx.beginPath();ctx.arc(cx,cy,R*.55,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#6B5B5E';ctx.font='700 16px sans-serif';ctx.textAlign='center';ctx.fillText('¥'+total.toFixed(0),cx,cy+6);
    lg.innerHTML=data.map((d,i)=>`<span>● ${d[0]} ¥${d[1].toFixed(0)}（${(d[1]/total*100).toFixed(1)}%）</span>`).join('');
  }else if(rt==='trend'){
    const days=new Date(+finMonth.slice(0,4),+finMonth.slice(5,7),0).getDate();
    const per=Array(days+1).fill(0);mrecs.filter(r=>r.type==='expense').forEach(r=>per[parseInt(r.date.slice(8,10))]+=r.amount);
    const max=Math.max(...per,1);box.innerHTML='<canvas id="bar" width="640" height="220"></canvas>';
    const ctx=document.getElementById('bar').getContext('2d');const W=640,H=220,bw=W/days;
    per.slice(1).forEach((v,i)=>{const h=v/max*160;ctx.fillStyle='#F5B8C8';roundRect(ctx,i*bw+4,H-30-h,bw-8,h,6);ctx.fill();ctx.fillStyle='#A49196';ctx.font='9px sans-serif';ctx.textAlign='center';if((i+1)%2)ctx.fillText(i+1,i*bw+bw/2,H-14);});
    lg.innerHTML=`<span>本月每日支出 · 峰值 ¥${max.toFixed(0)}</span>`;
  }else{
    const inc=mrecs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),exp=mrecs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
    const max=Math.max(inc,exp,1);box.innerHTML='<canvas id="bar" width="300" height="240"></canvas>';
    const ctx=document.getElementById('bar').getContext('2d');
    [['收入',inc,'#BFE3D6'],['支出',exp,'#F5B8C8']].forEach((d,i)=>{const h=d[1]/max*150,x=70+i*120;roundRect(ctx,x,200-h,60,h,10);ctx.fillStyle=d[2];ctx.fill();ctx.fillStyle='#6B5B5E';ctx.font='700 13px sans-serif';ctx.textAlign='center';ctx.fillText('¥'+d[1].toFixed(0),x+30,192-h);ctx.font='12px sans-serif';ctx.fillStyle='#A49196';ctx.fillText(d[0],x+30,222);});
    lg.innerHTML=`<span>本月结余 ¥${(inc-exp).toFixed(2)}</span>`;
  }
}
function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const FOODDB=[['米饭',200],['面条',280],['包子',180],['饺子',300],['粥',120],['面包',250],['蛋糕',350],['奶茶',400],['咖啡',150],['牛奶',120],['鸡蛋',80],['鸡',250],['牛',350],['猪',400],['鱼',180],['虾',120],['蔬菜',80],['沙拉',150],['水果',100],['苹果',80],['香蕉',90],['火锅',800],['烧烤',700],['汉堡',550],['披萨',600],['薯条',350],['可乐',180],['冰淇淋',250],['巧克力',300],['酸奶',150]];

async function addOutfit(){
  const raw=window._ofImgData;

  const noteEl=document.getElementById('ofNote');
  D.outfit.daily.push({id:uid(),date:today(),time:nowTime(),note:noteEl?noteEl.value:'',img:ref,items:window._lastParsedIds||[]});
  window._lastParsedIds=null;
  save();renderOutfit();toast('今日穿搭已收录 📸');
}
function delOutfit(id){D.outfit.daily=D.outfit.daily.filter(o=>o.id!==id);save();renderOutfit();}
function addWardrobeItem(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const data=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);});
    let png=data;
    try{const im=await loadImgEl(data);png=cropCanvas(im,[0,0,1,1],520).toDataURL('image/png');}catch(_){}
    let ref=png;
    try{ref=await imgPut(png)||png;}catch(_){}
    const it={id:uid(),name:'新单品',category:'上衣',color:'—',season:'四季',img:ref,source:'手动',date:today()};
    D.outfit.wardrobe.push(it);save();wardCat='全部';renderOutfit();editWard(it.id);
  };
  inp.click();
}

function dmShift(n){const [y,m]=diaryMonth.split('-').map(Number);let nm=m+n,ny=y;if(nm<1){nm=12;ny--}if(nm>12){nm=1;ny++}diaryMonth=`${ny}-${String(nm).padStart(2,'0')}`;renderDiary();}

function voiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('micTip').textContent='当前浏览器不支持语音识别，试试 Chrome/Edge～';return;}
  const r=new SR();r.lang='zh-CN';r.interimResults=true;r.continuous=true;
  const base=document.getElementById('thText').value;
  document.getElementById('micTip').textContent='🎙 正在听你说…（再点一次结束）';
  r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;document.getElementById('thText').value=(base?base+' ':'')+s;window._voiceUsed=true;};
  r.onend=()=>{document.getElementById('micTip').textContent='已结束，语气原样保留 ✨';};
  r.onerror=e=>{document.getElementById('micTip').textContent='识别中断，可再试一次';};
  r.start();window._rec=r;
}

/* =========================================================
   AI 图像识别（饮食热量 / 穿搭单品）· 图片 IndexedDB 存储 · 抠图

const AI_PRESETS={
  openai:{name:'OpenAI',base:'https://api.openai.com/v1',model:'gpt-4o-mini'},
  zhipu:{name:'智谱 GLM-4V',base:'https://open.bigmodel.cn/api/paas/v4',model:'glm-4v-flash'},
  qwen:{name:'通义千问 VL',base:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-vl-plus'},
  silicon:{name:'硅基流动 SiliconFlow',base:'https://api.siliconflow.cn/v1',model:'Qwen/Qwen2.5-VL-72B-Instruct'},
  moonshot:{name:'月之暗面 Kimi',base:'https://api.moonshot.cn/v1',model:'moonshot-v1-8k-vision-preview'},
  custom:{name:'自定义（任意 OpenAI 兼容接口）',base:'',model:''}
};
function aiOK(){const a=D.ai||{};return !!(a.base&&a.model&&a.key);}
function aiLabel(){const a=D.ai||{};const p=AI_PRESETS[a.preset];return (p?p.name:'自定义')+' · '+a.model;}
function aiBarHTML(){
  const ok=aiOK();
  return `<div class="aibar"><span class="dot ${ok?'on':''}"></span>
    <b>AI 图像识别</b> ${ok?esc(aiLabel()):'未配置（填一个支持看图的模型即可自动识别）'}
    <button class="btn ghost mini" onclick="openAISettings()">${ok?'⚙️ 设置':'⚙️ 去设置'}</button></div>`;
}
function aiApplyPreset(k){
  const p=AI_PRESETS[k];if(!p)return;
  if(p.base)document.getElementById('aiBase').value=p.base;
  if(p.model)document.getElementById('aiModel').value=p.model;
}
function openAISettings(after){
  const a=D.ai||{},cur=a.preset||'openai';
  const opts=Object.keys(AI_PRESETS).map(k=>`<option value="${k}" ${cur===k?'selected':''}>${AI_PRESETS[k].name}</option>`).join('');
  const base=a.base||(AI_PRESETS[cur]?AI_PRESETS[cur].base:'');
  const model=a.model||(AI_PRESETS[cur]?AI_PRESETS[cur].model:'');
  openModal('🤖 AI 图像识别设置',`
    <div class="aihelp">饮食热量识别、穿搭拆解都靠一个「能看图」的大模型，用 <b>OpenAI 兼容接口</b> 就能接：填接口地址 + 模型名 + 你自己的 API Key。<br>
    Key <b>只存在这台设备的浏览器里</b>；识别时照片会直接发给你填的服务商，不经过任何中间服务器。</div>
    <div class="field"><b>服务商预设</b><select id="aiPreset" onchange="aiApplyPreset(this.value)">${opts}</select></div>
    <div class="field"><b>接口地址</b><input id="aiBase" value="${esc(base)}" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><b>模型名（必须支持图片输入）</b><input id="aiModel" list="aiModelList" value="${esc(model)}" placeholder="gpt-4o-mini"><datalist id="aiModelList"></datalist></div>
    <div class="field"><b>API Key</b><input id="aiKey" type="password" value="${esc(a.key||'')}" placeholder="sk-…"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)"><input type="checkbox" id="aiCutout" style="width:16px;height:16px" ${a.cutout!==false?'checked':''}> 解析穿搭时自动抠图（去掉背景）</label>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn ghost mini" onclick="aiPullModels()">🔍 读取可用模型</button>
      <span id="aiTestMsg" style="font-size:11px;color:var(--sub)"></span></div>
    <div class="aihelp" style="background:var(--mint-soft);color:#7E9C8C">没有 Key 也能用：饮食会退回本机常见食物库估算，穿搭可以手动添加单品。</div>
    <div class="aihelp" style="font-size:10.5px">小提示：识别需要联网把照片发给服务商，用本地地址（预览里的 http://localhost…）打开最稳；如果直接双击 file:// 打开被拒绝，可在服务商后台把来源加白或改用本地地址。</div>
  `,async()=>{
    D.ai.base=document.getElementById('aiBase').value.trim();
    D.ai.model=document.getElementById('aiModel').value.trim();
    D.ai.key=document.getElementById('aiKey').value.trim();
    D.ai.preset=document.getElementById('aiPreset').value;
    D.ai.cutout=document.getElementById('aiCutout').checked;
    save();
    if(page==='diet')renderDiet();
    if(page==='outfit')renderOutfit();
    toast('AI 设置已保存 🤖');
    if(typeof after==='function')setTimeout(after,150);
    return true;
  });
}
async function aiPullModels(){
  const base=(document.getElementById('aiBase').value||'').trim().replace(/\/+$/,'');
  const key=(document.getElementById('aiKey').value||'').trim();
  const msg=document.getElementById('aiTestMsg');
  if(!base||!key){msg.textContent='先填接口地址和 Key 哦';return;}
  msg.textContent='读取中…';
  try{
    const r=await fetch(base+'/models',{headers:{'Authorization':'Bearer '+key}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const ids=((j&&j.data)||[]).map(m=>m.id).filter(Boolean);
    if(!ids.length)throw new Error('没有返回模型');
    document.getElementById('aiModelList').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');
    const vis=ids.find(i=>/vl|vision|4o|4\.1|glm-4v|gemini|pixtral|internvl/i.test(i));
    if(vis)document.getElementById('aiModel').value=vis;
    msg.innerHTML=`✅ 读到 ${ids.length} 个模型${vis?'，已自动选 <b>'+esc(vis)+'</b>':''}`;
  }catch(e){msg.textContent='读取失败：'+e.message+'（可直接手填模型名）';}
}
async function aiChat(messages,opt){
  const a=D.ai||{};
  if(!aiOK())throw new Error('还没配置 AI 服务');
  const url=a.base.replace(/\/+$/,'')+'/chat/completions';
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);
  let r;
  try{
    r=await fetch(url,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},
      body:JSON.stringify({model:a.model,messages,temperature:0.2,max_tokens:(opt&&opt.max)||1000})});
  }catch(e){
    clearTimeout(timer);
    if(e&&e.name==='AbortError')throw new Error('请求超时（90 秒），检查一下网络');
    throw new Error('请求被拦截（多为跨域限制或断网），可换个服务商或在本地服务器下打开试试');
  }
  clearTimeout(timer);
  if(!r.ok){
    let t='';try{t=await r.text();}catch(_){}
    if(r.status===401||r.status===403)throw new Error('API Key 不正确或没有权限');
    if(r.status===404)throw new Error('接口地址 / 模型名不对（404）');
    if(r.status===429)throw new Error('请求太频繁或额度用完了（429）');
    if(r.status===400)throw new Error('请求被拒绝（400）：该模型可能不支持看图');
    throw new Error('接口返回 '+r.status+'：'+String(t).slice(0,120));
  }
  const j=await r.json();
  const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!c)throw new Error('模型没有返回内容');
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(x=>x&&x.text||'').join('');
  return String(c);
}
function extractJSON(t){
  t=String(t||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const s=t.search(/[[{]/);
  if(s<0)return null;
  const open=t[s],close=open==='{'?'}':']';
  let depth=0,inStr=false,esc2=false;
  for(let i=s;i<t.length;i++){
    const ch=t[i];
    if(inStr){
      if(esc2)esc2=false;
      else if(ch==='\\')esc2=true;
      else if(ch==='"')inStr=false;
      continue;
    }
    if(ch==='"'){inStr=true;continue;}
    if(ch===open)depth++;
    else if(ch===close){depth--;if(depth===0){try{return JSON.parse(t.slice(s,i+1));}catch(e){return null;}}}
  }
  return null;
}
/* ---------- 图片处理 ---------- */
function loadImgEl(src){
  return new Promise((res,rej)=>{
    const i=new Image();let done=false;
    const to=setTimeout(()=>{if(!done){done=true;rej(new Error('图片加载超时，换一张试试'));}},15000);
    i.onload=()=>{if(!done){done=true;clearTimeout(to);res(i);}};
    i.onerror=()=>{if(!done){done=true;clearTimeout(to);rej(new Error('图片读取失败'));}};
    i.src=src;
  });
}
async function shrinkImg(data,max,q){
  const im=await loadImgEl(data);
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
  const s=Math.min(1,(max||1024)/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q||0.82);
}
function cropCanvas(im,box,max){
  const W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;
  let bx=0,by=0,bw=1,bh=1;
  if(Array.isArray(box)&&box.length===4){
    bx=Number(box[0]);by=Number(box[1]);bw=Number(box[2]);bh=Number(box[3]);
    if(!isFinite(bx))bx=0;if(!isFinite(by))by=0;
    if(!isFinite(bw)||bw<=0)bw=1;if(!isFinite(bh)||bh<=0)bh=1;
    if(bw>1)bw=bw/100;if(bh>1)bh=bh/100;if(bx>1)bx=bx/100;if(by>1)by=by/100;
  }
  bx=Math.min(Math.max(bx,0),1);by=Math.min(Math.max(by,0),1);
  bw=Math.min(Math.max(bw,0.05),1-bx);bh=Math.min(Math.max(bh,0.05),1-by);
  const px=bw*0.025,py=bh*0.025;
  const sx=Math.max(0,Math.round((bx-px)*W)),sy=Math.max(0,Math.round((by-py)*H));
  const sw=Math.max(2,Math.min(W-sx,Math.round((bw+px*2)*W)));
  const sh=Math.max(2,Math.min(H-sy,Math.round((bh+py*2)*H)));
  const s=Math.min(1,(max||480)/Math.max(sw,sh));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*s));c.height=Math.max(1,Math.round(sh*s));
  c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
  return c;
}
/* 取边框主色作为背景参考色，从四边泛洪抠掉背景，抠坏了就退回原图 */
function cutoutCanvas(c,tol){
  const W=c.width,H=c.height,x=c.getContext('2d');
  let id;
  try{id=x.getImageData(0,0,W,H);}catch(e){return c;}
  const d=id.data;
  const map={};
  const add=p=>{
    const o=p*4,key=(d[o]>>4)+','+(d[o+1]>>4)+','+(d[o+2]>>4);
    const m=map[key]||(map[key]={n:0,r:0,g:0,b:0});
    m.n++;m.r+=d[o];m.g+=d[o+1];m.b+=d[o+2];
  };
  for(let i=0;i<W;i++){add(i);add((H-1)*W+i);}
  for(let j=0;j<H;j++){add(j*W);add(j*W+W-1);}
  let best=null;
  for(const k in map){if(!best||map[k].n>best.n)best=map[k];}
  if(!best)return c;
  const br=best.r/best.n,bg=best.g/best.n,bb=best.b/best.n;
  const T=(tol||34),T2=T*T*3;
  const ok=p=>{const o=p*4,dr=d[o]-br,dg=d[o+1]-bg,db=d[o+2]-bb;return dr*dr+dg*dg+db*db<=T2;};
  const seen=new Uint8Array(W*H),q=new Int32Array(W*H);
  let qh=0,qt=0;
  const push=p=>{if(!seen[p]&&ok(p)){seen[p]=1;q[qt++]=p;}};
  for(let i=0;i<W;i++){push(i);push((H-1)*W+i);}
  for(let j=0;j<H;j++){push(j*W);push(j*W+W-1);}
  while(qh<qt){
    const p=q[qh++],px=p%W,py=(p-px)/W;
    if(px>0)push(p-1);
    if(px<W-1)push(p+1);
    if(py>0)push(p-W);
    if(py<H-1)push(p+W);
  }
  let rm=0;
  for(let p=0;p<W*H;p++)if(seen[p])rm++;
  const ratio=rm/(W*H);
  if(ratio>0.95||ratio<0.05)return c;
  for(let p=0;p<W*H;p++)if(seen[p])d[p*4+3]=0;
  for(let py=1;py<H-1;py++)for(let px=1;px<W-1;px++){
    const p=py*W+px;
    if(seen[p])continue;
    if(seen[p-1]||seen[p+1]||seen[p-W]||seen[p+W]){const o=p*4;if(d[o+3]>115)d[o+3]=115;}
  }
  x.putImageData(id,0,0);
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){
    if(d[(py*W+px)*4+3]>10){if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;}
  }
  if(x1<=x0||y1<=y0)return c;
  const pad=Math.max(2,Math.round(Math.max(x1-x0,y1-y0)*0.035));
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
  x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
  const cw=x1-x0+1,ch=y1-y0+1;
  const n=document.createElement('canvas');n.width=cw;n.height=ch;
  n.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
  return n;
}

    if(fromLS)R=Object.assign({shelf:{read:[],reading:[],wish:[]},excerpts:[],sessions:[],migrated:false},fromLS);
  }
  try{if(navigator.storage&&navigator.storage.persisted)rPersist=(await navigator.storage.persisted())?'granted':'no';}catch(_){}
  await rMigrateOld();
  renderReadState();
}
async function rMigrateOld(){
  if(R.migrated)return;
  const olds=(D.media&&D.media.book)||[];
  olds.forEach(b=>{
    R.shelf.read.push({id:uid(),title:b.name,author:'',finishDate:b.date||today(),stars:b.stars||0,note:b.note||'',source:'本地',createdAt:b.date||today()});
    (b.excerpts||[]).forEach(e=>R.excerpts.push({id:uid(),text:e.text,bookTitle:b.name,bookId:'',note:'',tags:[],createdAt:e.time||today()}));
  });
  R.migrated=true;
  await rSave();
}
async function rSave(){
  R.updated=Date.now();
  /* 双写：localStorage 永远有一份，IndexedDB 再存一份，任何一边坏了都能救回来 */
  try{localStorage.setItem('swlandll_reading',JSON.stringify(R));}catch(_){}
  try{
    if(rdb&&!rFallback)await rSet(R);
  }catch(e){rFallback=true;toast('数据库写入异常，已改用本地存档');}
  renderReadState();
  if(typeof scheduleSync==='function')scheduleSync();
}
function renderReadState(){
  const el=document.getElementById('rState');if(!el)return;
  const total=R.shelf.read.length+R.shelf.reading.length+R.shelf.wish.length;
  const d=R.updated?new Date(R.updated):null;
  const saved=d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'—';
  const perm={granted:'🔒 持久存储已开启',denied:'⚠️ 持久存储未授权',no:'⚠️ 持久存储未开启',unsupported:'当前环境不支持持久存储',unknown:'存储权限检测中…'}[rPersist]||'';
  el.innerHTML=`${rFallback?'localStorage 兜底':'IndexedDB 已连接'} · 上次保存 ${saved} · 书架 ${total} 本 · 摘录 ${R.excerpts.length} 条 · 阅读记录 ${R.sessions.length} 条 · 影视 ${(R.movies?R.movies.watched.length+R.movies.watching.length+R.movies.wish.length:0)} 部 · 音乐 ${(R.music?R.music.fav.length+R.music.loop.length+R.music.wish.length:0)} 首 · ${perm}`;
}

/* ---------- 通用弹窗 ---------- */
function openModal(title,bodyHTML,onSave){

/* ---------- 1. 我的书架 ---------- */
const STAR=n=>'★'.repeat(Math.max(0,Math.min(5,n||0)))+'☆'.repeat(5-Math.max(0,Math.min(5,n||0)));
function readPct(it){
  if(it.mode==='page'){const t=+it.total||0,p=+it.page||0;return t?Math.max(0,Math.min(100,Math.round(p/t*100))):0;}
  return Math.max(0,Math.min(100,Math.round(+it.percent||0)));
}
function shelfHTML(){
  const s=R.shelf;
  return `<div class="wx-banner">📥 <b>从微信读书导入</b>：无法自动实时同步。支持粘贴微信读书导出的文本 / JSON 批量导入，导入条目会自动标记来源「微信读书」。
    <button class="btn ghost mini" style="margin-left:auto" onclick="openWxImport()">开始导入</button></div>
    ${groupHTML('read','✅ 已经阅读','读完的每一本都算数',s.read)}
    ${groupHTML('reading','📖 正在阅读','记录进度与当下想法',s.reading)}
    ${groupHTML('wish','🌱 想要阅读','想读的先收藏起来',s.wish)}`;
}
function groupHTML(kind,title,hint,list){
  return `<section class="bk-group">
    <div class="bk-group-head"><h3>${title}</h3><span class="bk-count">${list.length}</span><span class="bk-hint">${hint}</span>
      <button class="bk-add" onclick="openBookEditor('${kind}')">＋ 新增</button></div>
    <div class="bk-grid">${list.length?list.slice().reverse().map(it=>bookCard(kind,it)).join(''):`<div class="bk-empty">还没有记录，点「＋ 新增」添加～</div>`}</div>
  </section>`;
}
function bookCard(kind,it){
  let body='';
  if(kind==='read'){
    body=`<div class="bk-meta">${it.author?esc(it.author)+' · ':''}读完 ${it.finishDate||'—'}</div>
      <div class="bk-stars">${STAR(it.stars)}</div>
      ${it.note?`<div class="bk-note">${esc(it.note)}</div>`:''}`;
  }else if(kind==='reading'){
    const pct=readPct(it);
    const label=it.mode==='page'?`第 ${it.page||0}${it.total?' / '+it.total:''} 页 · ${pct}%`:`已读 ${pct}%`;
    body=`<div class="bk-meta">${it.author?esc(it.author)+' · ':''}开始于 ${it.startDate||'—'}</div>
      <div class="bk-progress"><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="pr"><span>${label}</span><span>${pct>=100?'可以收尾啦':'继续加油'}</span></div></div>
      ${it.note?`<div class="bk-note">${esc(it.note)}</div>`:''}`;
  }else{
    body=`<div class="bk-meta">${it.author?esc(it.author):'作者未填'}</div>
      ${it.reason?`<div class="bk-note">💡 ${esc(it.reason)}</div>`:''}
      ${(it.tags&&it.tags.length)?`<div class="bk-tags">${it.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}`;
  }
  const src=it.source&&it.source!=='本地'?`<span class="chip src">${esc(it.source)}</span>`:'';
  return `<div class="bk-card">
    <div class="bk-title">《${esc(it.title)}》${src}</div>
    ${body}
    <div class="bk-acts">
      ${kind==='reading'?`<button class="primary" onclick="finishBook('${it.id}')">读完了 →</button>`:''}
      ${kind==='wish'?`<button class="primary" onclick="startBook('${it.id}')">开始阅读 →</button>`:''}
      <button onclick="openBookEditor('${kind}','${it.id}')">编辑</button>
      <button class="danger" onclick="delBook('${kind}','${it.id}')">删除</button>
    </div></div>`;
}
async function finishBook(id){
  const it=R.shelf.reading.find(x=>x.id===id);if(!it)return;
  const d=prompt('读完日期（YYYY-MM-DD）：',today());
  if(d===null)return;
  R.shelf.reading=R.shelf.reading.filter(x=>x.id!==id);
  R.shelf.read.push({id:uid(),title:it.title,author:it.author||'',finishDate:d||today(),stars:it.stars||0,note:it.note||'',source:it.source||'本地',createdAt:it.startDate||today()});
  await rSave();renderBookTab();toast('已移入「已经阅读」🎉');
}
async function startBook(id){
  const it=R.shelf.wish.find(x=>x.id===id);if(!it)return;
  R.shelf.wish=R.shelf.wish.filter(x=>x.id!==id);
  R.shelf.reading.push({id:uid(),title:it.title,author:it.author||'',mode:'percent',percent:0,page:0,total:0,startDate:today(),note:it.reason||'',source:it.source||'本地'});
  await rSave();renderBookTab();toast('已开始阅读，加油 📖');
}
async function delBook(kind,id){
  const it=R.shelf[kind].find(x=>x.id===id);if(!it)return;
  if(!confirm(`确定删除《${it.title}》吗？`))return;
  R.shelf[kind]=R.shelf[kind].filter(x=>x.id!==id);
  await rSave();renderBookTab();toast('已删除');
}
function openBookEditor(kind,id){
  const it=id?R.shelf[kind].find(x=>x.id===id):null;
  const isEdit=!!it;
  const starSel=n=>[0,1,2,3,4,5].map(i=>`<option value="${i}" ${i===(n||0)?'selected':''}>${i?'★'.repeat(i):'暂不评分'}</option>`).join('');
  let fields=`<label class="field"><b>书名 *</b><input id="fTitle" value="${esc(it?it.title:'')}" placeholder="书籍名称"></label>
    <label class="field"><b>作者</b><input id="fAuthor" value="${esc(it?it.author:'')}" placeholder="可选"></label>`;
  if(kind==='read'){
    fields+=`<div class="two-col">
      <label class="field"><b>读完日期</b><input id="fDate" type="date" value="${it?it.finishDate||today():today()}"></label>
      <label class="field"><b>星级评分</b><select id="fStars">${starSel(it?it.stars:0)}</select></label></div>
      <label class="field"><b>阅读感想</b><textarea id="fNote" placeholder="读完的想法…">${esc(it?it.note:'')}</textarea></label>`;
  }else if(kind==='reading'){
    fields+=`<label class="field"><b>进度方式</b><select id="fMode" onchange="toggleReadFields()">
        <option value="percent" ${(!it||it.mode!=='page')?'selected':''}>按百分比</option>
        <option value="page" ${it&&it.mode==='page'?'selected':''}>按页码</option></select></label>
      <div class="two-col">
        <label class="field" id="wrapPercent"><b>已读百分比</b><input id="fPercent" type="number" min="0" max="100" value="${it&&it.percent!=null?it.percent:''}" placeholder="35"></label>
        <label class="field" id="wrapPage"><b>当前页码</b><input id="fPage" type="number" min="0" value="${it&&it.page!=null?it.page:''}" placeholder="120"></label>
        <label class="field" id="wrapTotal"><b>总页数</b><input id="fTotal" type="number" min="0" value="${it&&it.total!=null?it.total:''}" placeholder="320"></label>
        <label class="field"><b>开始阅读日期</b><input id="fDate" type="date" value="${it?it.startDate||today():today()}"></label></div>
      <label class="field"><b>当前感想</b><textarea id="fNote" placeholder="读到哪了，想到什么…">${esc(it?it.note:'')}</textarea></label>`;
  }else{
    fields+=`<label class="field"><b>想读理由</b><textarea id="fReason" placeholder="为什么想读？">${esc(it?it.reason:'')}</textarea></label>
      <label class="field"><b>标签</b><input id="fTags" value="${it?esc((it.tags||[]).join(',')):''}" placeholder="用逗号分隔，如：心理学,自我成长"></label>`;
  }
  openModal(isEdit?'编辑书籍':(kind==='read'?'添加一本读完的书':kind==='reading'?'添加正在阅读':'添加想读的书'),fields,async()=>{
    const title=document.getElementById('fTitle').value.trim();
    if(!title){toast('书名不能为空');return false;}
    const base={title,author:document.getElementById('fAuthor').value.trim()};
    if(kind==='read'){
      Object.assign(base,{finishDate:document.getElementById('fDate').value||today(),stars:+document.getElementById('fStars').value||0,note:document.getElementById('fNote').value.trim()});
    }else if(kind==='reading'){
      Object.assign(base,{mode:document.getElementById('fMode').value,percent:+document.getElementById('fPercent').value||0,page:+document.getElementById('fPage').value||0,total:+document.getElementById('fTotal').value||0,startDate:document.getElementById('fDate').value||today(),note:document.getElementById('fNote').value.trim()});
    }else{
      const tags=document.getElementById('fTags').value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
      Object.assign(base,{reason:document.getElementById('fReason').value.trim(),tags});
    }
    if(isEdit)Object.assign(it,base);
    else R.shelf[kind].push(Object.assign({id:uid(),source:'本地',createdAt:today()},base));
    await rSave();renderBookTab();toast(isEdit?'已更新':'已添加 🌿');
    return true;
  });
  if(kind==='reading')toggleReadFields();
}
function toggleReadFields(){
  const m=document.getElementById('fMode');if(!m)return;
  const page=m.value==='page';
  document.getElementById('wrapPercent').style.display=page?'none':'flex';
  document.getElementById('wrapPage').style.display=page?'flex':'none';
  document.getElementById('wrapTotal').style.display=page?'flex':'none';
}

function openExcerptEditor(id){

    <label class="field"><b>个人批注</b><textarea id="fNote" placeholder="看到这段时的想法…">${esc(e?e.note:'')}</textarea></label>

  onExBookChange();

function onExBookChange(){

async function delExcerpt(id){
  if(!confirm('确定删除这条摘录吗？'))return;

  await rSave();renderExList();toast('已删除');
}

/* ---------- 3. 阅读趋势 ---------- */
function weekMinutes(){
  const now=new Date();now.setHours(0,0,0,0);
  const mon=new Date(now);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  return R.sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d>=mon&&d<=now;}).reduce((a,s)=>a+(+s.minutes||0),0);
}
function trendHTML(){
  const byDate={};R.sessions.forEach(s=>{byDate[s.date]=(byDate[s.date]||0)+(+s.minutes||0);});
  const totalDays=Object.keys(byDate).filter(d=>byDate[d]>0).length;
  const totalMin=R.sessions.reduce((a,s)=>a+(+s.minutes||0),0);
  const mm=today().slice(0,7);
  const monthMin=R.sessions.filter(s=>s.date.startsWith(mm)).reduce((a,s)=>a+(+s.minutes||0),0);
  return `<div class="stat-row">
      <div class="stat"><div class="v">${totalDays}</div><div class="k">总阅读天数</div></div>
      <div class="stat"><div class="v">${(totalMin/60).toFixed(1)}</div><div class="k">总阅读时长(h)</div></div>
      <div class="stat"><div class="v">${(monthMin/60).toFixed(1)}</div><div class="k">本月时长(h)</div></div>
      <div class="stat"><div class="v">${weekMinutes()}</div><div class="k">本周(min)</div></div>
    </div>
    <div class="card"><h3>🔥 每日阅读热力图（近 20 周）</h3>${heatmapHTML(byDate)}</div>
    <div class="card"><h3>📊 ${trendRange==='week'?'近 8 周':'近 6 个月'}阅读时长
      <span class="mode-toggle" style="margin-left:auto">
        <button class="${trendRange==='week'?'on':''}" onclick="setTrend('week')">周</button>
        <button class="${trendRange==='month'?'on':''}" onclick="setTrend('month')">月</button></span></h3>
      ${barsHTML()}</div>
    <div class="card"><h3>➕ 手动记录阅读</h3>
      <div class="formrow">
        <input id="sDate" type="date" value="${today()}" style="width:148px">
        <input id="sMin" type="number" min="1" placeholder="时长（分钟）" style="width:124px">
        <input id="sBook" placeholder="书籍（可选）" style="flex:1;min-width:120px">
        <input id="sNote" placeholder="备注（可选）" style="flex:1;min-width:120px">
        <button class="btn mini" onclick="addSession()">保存</button>
      </div>
      <button class="btn ghost mini" style="margin-top:10px" onclick="openWxTimeImport()">📥 导入微信读书时长</button></div>
    <div class="card"><h3>🕘 最近阅读记录<span class="tag">${R.sessions.length} 条</span></h3>
      ${R.sessions.slice().reverse().slice(0,10).map(s=>`<div class="item">
        <div class="cicon" style="background:var(--sky-soft)">📖</div>
        <div class="grow"><div class="tt">${esc(s.bookTitle||'未标注书籍')}</div>
          <div class="meta">${s.date} · ${s.minutes} 分钟${s.note?' · '+esc(s.note):''}</div></div>
        <div class="op"><button onclick="delSession('${s.id}')">🗑</button></div></div>`).join('')||'<div class="empty">还没有阅读记录～</div>'}</div>`;
}
function heatmapHTML(byDate){
  const end=new Date();end.setHours(0,0,0,0);
  const start=new Date(end);start.setDate(start.getDate()-139);
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  let cells='';
  const d=new Date(start);
  while(d<=end){
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const m=byDate[key]||0;
    const lvl=m>=60?'l4':m>=31?'l3':m>=16?'l2':m>0?'l1':'';
    cells+=`<i class="${lvl}" title="${key} · ${m} 分钟"></i>`;
    d.setDate(d.getDate()+1);
  }
  return `<div class="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="heat-legend">少
      <i style="background:#F7EFF1"></i><i style="background:#FBE0E6"></i>
      <i style="background:#F7C2CF"></i><i style="background:#EF9FB4"></i>
      <i style="background:#E27F9C"></i> 多</div>`;
}
function barsHTML(){
  const data=[];
  if(trendRange==='week'){
    for(let i=7;i>=0;i--){
      const s=new Date();s.setHours(0,0,0,0);
      s.setDate(s.getDate()-((s.getDay()+6)%7)-i*7);
      const e=new Date(s);e.setDate(e.getDate()+6);
      const mins=R.sessions.filter(x=>{const d=new Date(x.date+'T00:00:00');return d>=s&&d<=e;}).reduce((a,x)=>a+(+x.minutes||0),0);
      data.push({label:`${s.getMonth()+1}/${s.getDate()}`,v:mins});
    }
  }else{
    for(let i=5;i>=0;i--){
      const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const mins=R.sessions.filter(x=>x.date.startsWith(key)).reduce((a,x)=>a+(+x.minutes||0),0);
      data.push({label:`${d.getMonth()+1}月`,v:mins});
    }
  }
  const max=Math.max(...data.map(d=>d.v),30);
  return `<div class="bars">${data.map(d=>`<div class="b">
      <span class="bv">${d.v||''}</span>
      <i style="height:${Math.max(4,Math.round(d.v/max*110))}px"></i>
      <span class="bl">${d.label}</span></div>`).join('')}</div>`;
}

/* ---------- 导入：微信读书 ---------- */
function openWxImport(){
  openModal('从微信读书导入',`
    <div class="mtip">⚠️ 无法自动实时同步微信读书。请将微信读书导出的文本或 JSON 粘贴到下方批量导入，条目会自动标记来源「微信读书」。</div>
    <label class="field"><b>粘贴内容</b><textarea id="wxText" style="min-height:170px" placeholder="格式一（JSON）：
[{&quot;title&quot;:&quot;书名&quot;,&quot;author&quot;:&quot;作者&quot;,&quot;status&quot;:&quot;读完&quot;,&quot;progress&quot;:100,&quot;date&quot;:&quot;2026-10-01&quot;}]
格式二（每行一本，逗号分隔）：
书名,作者,状态(读完/在读/想读),进度%,日期"></textarea></label>
    <div class="mtip">同名书籍会自动去重，不会重复导入。</div>
  `,async()=>{
    const raw=document.getElementById('wxText').value.trim();
    if(!raw){toast('请先粘贴内容');return false;}
    const list=parseWxBooks(raw);
    if(!list.length){toast('没有解析到可导入的书籍');return false;}
    let add=0;
    list.forEach(b=>{
      if([...R.shelf.read,...R.shelf.reading,...R.shelf.wish].some(x=>x.title===b.title))return;
      const base={id:uid(),title:b.title,author:b.author||'',source:'微信读书',createdAt:today()};
      if(b.status==='read')R.shelf.read.push(Object.assign(base,{finishDate:b.date||today(),stars:b.stars||0,note:b.note||''}));
      else if(b.status==='wish')R.shelf.wish.push(Object.assign(base,{reason:b.note||'',tags:['微信读书']}));
      else R.shelf.reading.push(Object.assign(base,{mode:'percent',percent:Math.max(0,Math.min(100,b.progress||0)),page:0,total:0,startDate:b.date||today(),note:b.note||''}));
      add++;
    });
    await rSave();renderBookTab();toast(add?`已导入 ${add} 本（来源：微信读书）`:'这些书都已经在书架里了');
    return true;
  });
}
function parseWxBooks(raw){
  let items=[];
  try{
    const j=JSON.parse(raw);
    const arr=Array.isArray(j)?j:(Array.isArray(j.books)?j.books:null);
    if(arr){
      items=arr.map(x=>({title:x.title||x.bookName||x.name||'',author:x.author||'',status:normStatus(x.status||x.state||''),progress:+x.progress||0,date:x.date||x.finishDate||'',stars:+x.stars||0,note:x.note||x.review||''}));
    }
  }catch(e){
    raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const p=l.split(/[\t,，|]+/).map(s=>s.trim());
      if(p.length<2)return;
      items.push({title:p[0].replace(/[《》]/g,''),author:p[1]||'',status:normStatus(p[2]||''),progress:parseFloat((p[3]||'').replace('%',''))||0,date:p[4]||'',stars:+p[5]||0,note:p[6]||''});
    });
  }
  return items.filter(x=>x.title);
}
function normStatus(s){
  if(/想读|待读/.test(s))return 'wish';
  if(/在读|阅读中|进行/.test(s))return 'reading';
  if(/读完|已读|完成/.test(s))return 'read';
  return 'read';
}
function openWxTimeImport(){
  openModal('导入微信读书时长',`
    <div class="mtip">支持 JSON 或每行「日期 分钟」格式，导入记录会标注来源微信读书。</div>
    <label class="field"><b>粘贴内容</b><textarea id="wxTime" style="min-height:150px" placeholder="2026-10-01,45
2026-10-02,30"></textarea></label>
  `,async()=>{
    const raw=document.getElementById('wxTime').value.trim();
    if(!raw){toast('请先粘贴内容');return false;}
    let list=[];
    try{
      const j=JSON.parse(raw);
      const arr=Array.isArray(j)?j:(j.data||j.sessions||[]);
      list=arr.map(x=>({date:x.date,minutes:+x.minutes||+x.duration||0,bookTitle:x.book||x.bookTitle||'',note:x.note||'微信读书'}));
    }catch(e){
      raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
        const p=l.split(/[\t,，|\s]+/);
        const d=p.find(x=>/^\d{4}-\d{1,2}-\d{1,2}$/.test(x));
        const nums=p.map(x=>parseFloat(x)).filter(x=>!isNaN(x)&&x<1440);
        const m=nums.length?nums[nums.length-1]:0;
        if(d&&m)list.push({date:d,minutes:m,bookTitle:'',note:'微信读书'});
      });
    }
    list=list.filter(x=>x.date&&x.minutes>0);
    if(!list.length){toast('没有解析到时长数据');return false;}
    list.forEach(x=>R.sessions.push({id:uid(),date:x.date,minutes:x.minutes,bookTitle:x.bookTitle||'',note:x.note||'微信读书'}));
    await rSave();renderBookTab();toast(`已导入 ${list.length} 天阅读时长`);
    return true;
  });
}
