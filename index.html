/* ---------- 导出 / 导入 / 持久存储 ---------- */
function exportReading(){
  const payload={app:'Swlandll · 书影音数据',version:1,exportedAt:new Date().toISOString(),data:R};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Swlandll书影音数据_${today()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('书影音数据已导出 ⬇');
}
function importReading(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      const parsed=JSON.parse(await f.text());
      const d=parsed.data||parsed;
      if(!d||typeof d!=='object')throw new Error('bad');
      if(!confirm('导入将覆盖当前全部书影音数据（书籍 / 影视 / 音乐 / 摘录 / 阅读记录），继续吗？'))return;
      R={shelf:{read:[],reading:[],wish:[]},excerpts:[],sessions:[],movies:{watched:[],watching:[],wish:[]},music:{fav:[],loop:[],wish:[]},migrated:true};
      ['read','reading','wish'].forEach(k=>{
        if(d.shelf&&Array.isArray(d.shelf[k]))R.shelf[k]=d.shelf[k].filter(x=>x&&x.title).map(x=>Object.assign({id:uid(),source:'本地',createdAt:today()},x,{id:x.id||uid()}));
      });
      if(Array.isArray(d.excerpts))R.excerpts=d.excerpts.filter(x=>x&&x.text).map(x=>Object.assign({id:uid(),createdAt:today()},x,{id:x.id||uid()}));
      if(Array.isArray(d.sessions))R.sessions=d.sessions.filter(x=>x&&x.date).map(x=>Object.assign({id:uid(),minutes:0},x,{id:x.id||uid()}));
      if(d.movies){['watched','watching','wish'].forEach(k=>{if(Array.isArray(d.movies[k]))R.movies[k]=d.movies[k].filter(x=>x&&x.title).map(x=>Object.assign({id:uid()},x,{id:x.id||uid()}));});}
      if(d.music){['fav','loop','wish'].forEach(k=>{if(Array.isArray(d.music[k]))R.music[k]=d.music[k].filter(x=>x&&x.title).map(x=>Object.assign({id:uid()},x,{id:x.id||uid()}));});}
      await rSave();if(page==='movie')renderMovie();else if(page==='music')renderMusic();else renderBook();toast('书影音数据已恢复 ✅');
    }catch(e){toast('导入失败：文件格式不正确');}
  };
  inp.click();
}
async function requestPersist(){
  if(!navigator.storage||!navigator.storage.persist)return toast('当前环境不支持持久存储申请');
  try{
    const ok=await navigator.storage.persist();
    rPersist=ok?'granted':'denied';
    renderReadState();
    toast(ok?'已获得持久存储权限 ✅':'申请未通过，建议定期导出 JSON 备份');
  }catch(e){toast('申请失败，建议定期导出 JSON 备份');}
}

    D.deviceId=kind+'·'+uid().slice(-4).toUpperCase();persist();
  }
  return D.deviceId;
}
function freshR(){return {shelf:{read:[],reading:[],wish:[]},excerpts:[],sessions:[],movies:{watched:[],watching:[],wish:[]},music:{fav:[],loop:[],wish:[]},migrated:true};}
function dataHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function fmtTs(ts){if(!ts)return '—';const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function countsOf(p){
  const d=(p&&p.data&&p.data.D)||{},r=(p&&p.data&&p.data.R)||{};
  const n=a=>Array.isArray(a)?a.length:0;
  return n(d.diary)+n(d.thoughts)+n(d.review)+n(d.finance&&d.finance.records)+n(d.diet&&d.diet.records)
    +n(d.todo&&d.todo.todo)+n(d.todo&&d.todo.monthly)+n(d.todo&&d.todo.plan)
    +n(d.outfit&&d.outfit.daily)+n(d.outfit&&d.outfit.wardrobe)
    +n(r.excerpts)+n(r.sessions)
    +n(r.shelf&&r.shelf.read)+n(r.shelf&&r.shelf.reading)+n(r.shelf&&r.shelf.wish)
    +n(r.movies&&r.movies.watched)+n(r.movies&&r.movies.watching)+n(r.movies&&r.movies.wish)
    +n(r.music&&r.music.fav)+n(r.music&&r.music.loop)+n(r.music&&r.music.wish);
}
function collectImages(){const o={};Object.keys(IMG).forEach(k=>{if(IMG[k])o[k]=IMG[k];});return o;}
async function putImages(map){
  for(const k of Object.keys(map||{})){
    IMG[k]=map[k];
    if(mdb&&!mFallback){try{await mPutRec({id:k,data:map[k],t:Date.now()});}catch(_){}}
  }
}
/* 打包：不含 API Key、不含同步配置 */
async function buildPayload(withImages){
  const cfg=D.sync||{};
  const dd=JSON.parse(JSON.stringify(D));
  delete dd.sync;delete dd.ai;delete dd.deviceId;delete dd.updatedAt;
  const rr=JSON.parse(JSON.stringify(R||freshR()));
  delete rr.updated;
  const p={app:'Swlandll',version:2,savedAt:Math.max(D.updatedAt||0,(R&&R.updated)||0),device:deviceId(),data:{D:dd,R:rr}};
  if(withImages&&cfg.withImages!==false)p.images=collectImages();
  p.hash=dataHash(JSON.stringify(p.data)+(p.images?Object.keys(p.images).sort().join(','):''));
  return p;
}
function rerender(){
  try{
    if(page==='movie')renderMovie();
    else if(page==='music')renderMusic();
    else if(page==='book')renderBook();
    else if(PAGES[page])PAGES[page]();
  }catch(_){}
}
async function applyPayload(p){
  _applying=true;
  try{
    if(p.data&&p.data.D){
      const next=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),p.data.D);
      next.sync=D.sync;next.ai=D.ai;next.deviceId=D.deviceId;
      next.updatedAt=p.savedAt||Date.now();
      D=next;persist();
    }
    if(p.data&&p.data.R){R=Object.assign(freshR(),p.data.R);await rSave();}
    if(p.images)await putImages(p.images);
    rerender();
  }finally{_applying=false;}
  renderSyncBadge();
}

/* ---------- 云端通道（可换自建地址） ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>{setTimeout(()=>rej(new Error('网络超时')),ms||15000);})]);}
const CLOUD={
  builtin:{
    /* 与页面同源的轻量存档接口（server.js 提供），换设备只要打开同一个链接 */
    url(code){return location.origin+'/api/sync/'+encodeURIComponent(code)+(location.search||'');},
    async create(payload){
      const code=genCode();
      await this.put(code,payload);
      return code;
    },
    async put(code,payload){
      const r=await withTimeout(fetch(this.url(code),
        {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}));
      if(!r.ok)throw new Error(r.status===404?'当前地址没有同步接口':'上传失败 '+r.status);
    },
    async get(code){
      const r=await withTimeout(fetch(this.url(code),{cache:'no-store'}));
      if(r.status===404)return null;
      if(!r.ok)throw new Error('读取失败 '+r.status);
      const t=(await r.text()).trim();return t?JSON.parse(t):null;
    }
  },
  custom:{
    url(code){
      const base=(D.sync.endpoint||'').trim();
      if(!base)throw new Error('先填自建地址');
      return base.indexOf('{code}')>=0?base.replace('{code}',encodeURIComponent(code)):base;
    },
    async create(){throw new Error('自建地址需要自己填存档码');},
    async put(code,payload){
      const r=await withTimeout(fetch(this.url(code),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}));
      if(!r.ok)throw new Error('上传失败 '+r.status);
    },
    async get(code){
      const r=await withTimeout(fetch(this.url(code),{cache:'no-store'}));
      if(r.status===404)return null;
      if(!r.ok)throw new Error('读取失败 '+r.status);
      const t=(await r.text()).trim();return t?JSON.parse(t):null;
    }
  }
};
function syncProv(){return (D.sync&&D.sync.provider==='custom')?CLOUD.custom:CLOUD.builtin;}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}

/* ---------- 同步动作 ---------- */
function scheduleSync(){
  if(_applying)return;
  const c=D.sync||{};
  if(!c.auto||!c.code)return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{cloudPush(true);},2500);
}
async function syncBoot(){
  deviceId();renderSyncBadge();
  const c=D.sync||{};
  if(!c.code)return;
  try{
    const remote=await syncProv().get(c.code);
    if(!remote||!remote.data)return;
    const local=await buildPayload(true);
    if(remote.hash&&remote.hash!==local.hash){
      c.pendingRemote=1;persist();renderSyncBadge();
      toast('☁️ 云端有一份不一样的数据，点「💾 备份 / 同步」可拉取或合并');
    }
  }catch(_){}
}
async function cloudCreate(){
  syncSaveFields();
  if(!confirm('会生成一个 8 位「存档码」，在手机 / 电脑上填同一个码就能互通。现在创建并上传？'))return;
  toast('正在创建云端存档…');
  try{
    const p=await buildPayload(true);
    const code=await syncProv().create(p);
    D.sync.code=code;D.sync.lastAt=Date.now();D.sync.pendingRemote=0;persist();
    if(document.getElementById('syncCode'))openBackup();
    renderSyncBadge();
    toast('存档码已生成：'+code+'（建议截图保存）');
  }catch(e){toast('创建失败：'+syncErrText(e));}
}
function syncErrText(e){
  const msg=(e&&e.message)||'未知错误';
  if(D.sync.provider!=='custom'&&/404|没有同步接口/.test(msg))
    return '当前地址不支持云端同步（把文件上传到纯静态空间时会出现）。可以改用「自建地址」，或者直接用备份文件在设备间搬。';
  return msg+'；本地记录不受影响';
}
async function cloudPush(silent){
  syncSaveFields();
  const c=D.sync||{};
  if(!c.code){if(!silent)toast('先创建或填写存档码');return 0;}
  try{
    const p=await buildPayload(true);
    await syncProv().put(c.code,p);
    c.lastAt=Date.now();c.pendingRemote=0;persist();renderSyncBadge();
    if(!silent)toast('已上传到云端 ✅');
    if(document.getElementById('syncInfo'))openBackup();
    return 1;
  }catch(e){
    if(!silent)toast('上传失败：'+syncErrText(e));
    return 0;
  }
}
async function cloudPull(){
  syncSaveFields();
  const c=D.sync||{};
  if(!c.code)return toast('先创建或填写存档码');
  toast('正在读取云端…');
  try{
    const remote=await syncProv().get(c.code);
    if(!remote||!remote.data)return toast('云端还没有数据，先点「上传到云端」');
    const local=await buildPayload(true);
    if(remote.hash&&remote.hash===local.hash){
      c.lastAt=Date.now();persist();renderSyncBadge();
      return toast('本机和云端已经一致 ✅');
    }
    /* 本机还是空的（新设备）→ 直接接收云端，不必问 */
    if(countsOf(local)===0&&countsOf(remote)>0){
      await applyPayload(remote);
      c.lastAt=Date.now();persist();renderSyncBadge();
      if(document.getElementById('syncInfo'))openBackup();
      return toast('已从云端恢复 ' + countsOf(remote) + ' 条记录 ✅');
    }
    openConflict(local,remote);
  }catch(e){toast('拉取失败：'+syncErrText(e));}
}
function openConflict(local,remote){
  const box=document.getElementById('mask');
  window._conflict={local,remote};
  box.innerHTML=`<div class="modal"><h3>⚠️ 发现两份不同的数据</h3>
    <div class="mbody">
      <div class="aihelp">本机和云端的记录不一样，选一份为准，或者合并（同一条记录用较新的那份，不会整份覆盖）。</div>
      <div class="cmpbox">
        <div><b>💻 本机</b>${fmtTs(local.savedAt)}<br>约 ${countsOf(local)} 条记录<br>设备 ${esc(local.device||'')}</div>
        <div><b>☁️ 云端</b>${fmtTs(remote.savedAt)}<br>约 ${countsOf(remote)} 条记录<br>设备 ${esc(remote.device||'')}</div>
      </div>
      <div class="syncnote">建议：平时只用一台设备记录就选「合并」；确定另一边的数据不要了，再选覆盖。</div>
    </div>
    <div class="mactions" style="flex-wrap:wrap">
      <button class="btn ghost" onclick="resolveConflict('local')">本机覆盖云端</button>
      <button class="btn ghost" onclick="resolveConflict('merge')">合并两份</button>
      <button class="btn" onclick="resolveConflict('remote')">云端覆盖本机</button>
    </div></div>`;
  box.classList.add('show');
  box.onclick=e=>{if(e.target===box)closeModal();};
}
async function resolveConflict(kind){
  const {local,remote}=window._conflict||{};
  closeModal();
  if(!local||!remote)return;
  if(kind==='remote'){
    await applyPayload(remote);toast('已用云端数据覆盖本机 ✅');
  }else if(kind==='local'){
    await cloudPush();toast('已用本机数据覆盖云端 ✅');
  }else{
    const merged=mergePayload(local,remote);
    await applyPayload(merged);
    await cloudPush(true);
    toast('两份已合并 ✅');
  }
}
function deepMerge(a,b){
  if(Array.isArray(a)&&Array.isArray(b)){
    const hasId=x=>x&&typeof x==='object'&&x.id;
    const m=new Map();
    if(a.every(hasId)&&b.every(hasId)){a.forEach(x=>m.set(x.id,x));b.forEach(x=>m.set(x.id,x));return [...m.values()];}
    a.concat(b).forEach(x=>m.set(JSON.stringify(x),x));return [...m.values()];
  }
  if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)){
    const o=Object.assign({},a);
    Object.keys(b).forEach(k=>{o[k]=(k in a)?deepMerge(a[k],b[k]):b[k];});
    return o;
  }
  return b===undefined?a:b;
}
function mergePayload(a,b){
  const newer=(b.savedAt||0)>=(a.savedAt||0)?b:a,older=(newer===b)?a:b;
  return {app:'Swlandll',version:2,device:newer.device||deviceId(),savedAt:Date.now(),
    data:{D:deepMerge(older.data.D||{},newer.data.D||{}),R:deepMerge(older.data.R||{},newer.data.R||{})},
    images:Object.assign({},older.images||{},newer.images||{}),hash:''};
}

/* ---------- 全量备份 ---------- */
async function exportAll(){
  try{
    const p=await buildPayload(true);p.kind='backup';
    const txt=JSON.stringify(p);
    const blob=new Blob([txt],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`Swlandll全量备份_${today()}_${nowTime().replace(':','')}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(`已导出 ${Math.max(1,Math.round(txt.length/1024))} KB ⬇`);
  }catch(e){toast('导出失败：'+e.message);}
}
function importAll(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      const p=JSON.parse(await f.text());
      const payload=(p.data&&(p.data.D||p.data.R))?p:(p.shelf?{data:{R:p}}:null);
      if(!payload)throw new Error('不是 Swlandll 的备份文件');
      const imgs=payload.images?Object.keys(payload.images).length:0;
      if(!confirm(`将用这份备份覆盖本机数据（约 ${countsOf(payload)} 条记录${imgs?'，'+imgs+' 张图片':''}）。\n如果本机已有重要记录，建议先导出一次再导入。继续？`))return;
      await applyPayload(payload);
      toast('数据已恢复 ✅');
      if(document.getElementById('syncInfo'))openBackup();
    }catch(e){toast('导入失败：'+(e.message==='不是 Swlandll 的备份文件'?e.message:'文件格式不正确'));}
  };
  inp.click();
}

/* ---------- 面板 ---------- */
function syncSaveFields(){
  const c=D.sync;if(!c)return;
  const code=document.getElementById('syncCode');
  const end=document.getElementById('syncEnd');
  const auto=document.getElementById('syncAuto');
  const img=document.getElementById('syncImg');
  let dirty=false;
  if(code&&code.value.trim()!==(c.code||'')){c.code=code.value.trim();dirty=true;}
  if(end&&end.value.trim()!==(c.endpoint||'')){c.endpoint=end.value.trim();dirty=true;}
  if(auto&&auto.checked!==!!c.auto){c.auto=auto.checked;dirty=true;}
  if(img&&img.checked!==(c.withImages!==false)){c.withImages=img.checked;dirty=true;}
  if(dirty)persist();
}
function syncSetProvider(v){syncSaveFields();D.sync.provider=v;persist();openBackup();}
function syncSetAuto(v){D.sync.auto=v;persist();toast(v?'已开启：每次保存后自动上传 ☁️':'已关闭自动上传');}
function syncSetImg(v){D.sync.withImages=v;persist();}
function renderSyncBadge(){
  const b=document.getElementById('cornerBackup');if(!b)return;
  const on=!!(D.sync&&D.sync.code);
  b.classList.toggle('off',!on);
  b.innerHTML=(on?'☁️':'💾')+' 备份 / 同步<i></i>';
}
function openBackup(){
  const c=D.sync||{};
  const imgs=Object.keys(IMG).length;
  const el=document.getElementById('mask');
  el.innerHTML=`<div class="modal"><h3>💾 备份 & 多端同步</h3>
  <div class="mbody">
    <div class="aihelp">本机存档 <b id="syncInfo">约 ${countsOf({data:{D,R}})} 条记录 · ${imgs} 张图片</b><br>
      上次保存 <span id="saveHint">${fmtTs(D.updatedAt)}</span> · 设备 ${esc(deviceId())}</div>
    <div class="syncnote">⚠️ 本地存储是兜底：清理浏览器缓存、换浏览器、换设备都会读不到。建议每周导出一次备份，或开启下面的云端同步。</div>
    <div class="syncrow">
      <button class="btn" onclick="exportAll()">⬇ 导出全部备份</button>
      <button class="btn ghost" onclick="importAll()">⬆ 导入备份恢复</button></div>
    <div class="syncbox">
      <b style="font-size:12px;color:#8E7F84">☁️ 云端存档（可选，失败也不影响本地）</b>
      <div class="syncrow">
        <input id="syncCode" value="${esc(c.code||'')}" placeholder="云端存档码">
        <button class="btn mini" onclick="cloudCreate()">创建存档码</button></div>
      <div class="syncrow">
        <button class="btn mini" onclick="cloudPush()">☁️ 上传到云端</button>
        <button class="btn mini ghost" onclick="cloudPull()">⬇ 从云端拉取</button>
        <span style="font-size:10.5px;color:var(--sub)">上次同步 ${c.lastAt?fmtTs(c.lastAt):'从未'}</span></div>
      <div class="syncrow">
        <select id="syncProv" onchange="syncSetProvider(this.value)">
          <option value="builtin" ${c.provider!=='custom'?'selected':''}>本链接内置同步</option>
          <option value="custom" ${c.provider==='custom'?'selected':''}>自建地址（进阶）</option>
        </select>
        ${c.provider==='custom'?`<input id="syncEnd" value="${esc(c.endpoint||'')}" placeholder="https://你的地址/api/sync/{code}">`:''}
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--sub)">
        <input type="checkbox" id="syncAuto" style="width:16px;height:16px" ${c.auto?'checked':''} onchange="syncSetAuto(this.checked)"> 保存后自动上传（只推云端，不会覆盖本机）</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--sub)">
        <input type="checkbox" id="syncImg" style="width:16px;height:16px" ${c.withImages!==false?'checked':''} onchange="syncSetImg(this.checked)"> 同步时带上图片（体积稍大）</label>
      <div class="syncnote" style="background:var(--mint-soft);color:#7E9C8C">换设备：在新设备打开同一个链接 → 填同一个存档码 → 点「从云端拉取」。两边都改过会弹窗让你选用哪一份或合并。</div>
    </div>
  </div>
  <div class="mactions"><button class="btn ghost" onclick="closeModal()">关闭</button></div></div>`;
  el.classList.add('show');
  el.onclick=e=>{if(e.target===el)closeModal();};
  el.querySelectorAll('input,select').forEach(i=>i.addEventListener('change',syncSaveFields));
}

/* ---------- PWA：manifest 内联 + 桌面图标 + Service Worker ---------- */
function iconDataURL(){
  try{
    const s=256,c=document.createElement('canvas');c.width=c.height=s;
    const x=c.getContext('2d');
    if(!x)return '';
    const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#FBE3EA');g.addColorStop(1,'#F0EAFB');
    x.fillStyle=g;
    const r=56;
    x.beginPath();
    x.moveTo(r,0);x.lineTo(s-r,0);x.quadraticCurveTo(s,0,s,r);x.lineTo(s,s-r);
    x.quadraticCurveTo(s,s,s-r,s);x.lineTo(r,s);x.quadraticCurveTo(0,s,0,s-r);
    x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.fill();
    x.fillStyle='#E58BA0';
    x.font='bold 132px "PingFang SC",sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText('S',s/2,s/2+8);
    return c.toDataURL('image/png');
  }catch(_){return '';}
}
async function bootPWA(){
  const icon=iconDataURL();
  if(icon){
    const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=icon;document.head.appendChild(ai);
  }
  /* 同目录有 manifest.json 就用它；只有单个 HTML 时自动内联一份，仍可添加到桌面 */
  let hasFile=false;
  try{const r=await fetch('manifest.json',{method:'GET',cache:'no-store'});hasFile=!!r.ok;}catch(_){hasFile=false;}
  if(!hasFile){
    const old=document.querySelector('link[rel="manifest"]');
    if(old)old.remove();
    const mf={
      name:'Swlandll · 生活工作台',short_name:'Swlandll',description:'本地优先的生活工作台',
      start_url:location.href.split('#')[0],scope:location.href.replace(/[^/]*$/,''),
      display:'standalone',background_color:'#FDF6F1',theme_color:'#FDF6F1',lang:'zh-CN',
      icons:icon?[{src:icon,sizes:'256x256',type:'image/png',purpose:'any'}]:[]
    };
    const link=document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(link);
  }
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    /* 带上分享参数，托管平台要求每个请求都携带它 */
    navigator.serviceWorker.register('sw.js'+(location.search||''),{scope:'./'}).catch(()=>{});
  }
}

/* ---------- 启动 ---------- */
renderSyncBadge();
bootPWA();
setTimeout(()=>{syncBoot();},1200);
</script>
